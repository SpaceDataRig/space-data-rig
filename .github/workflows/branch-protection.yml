name: Branch protection

# Applies SAFE branch protection to `main` using the runner's own GITHUB_TOKEN -- no local
# credential is involved. It blocks force-pushes and deletions and requires linear history, which
# protects the commit history that reproducibility and on-chain provenance depend on. It does NOT
# require a pull request or status checks, so the project's direct-push workflow keeps working.
# Idempotent: if protection is already set it is simply re-applied. Revert any rule from the
# repository's Settings -> Branches UI at any time.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  administration: write

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - name: Protect main (force-push/deletion off, linear history on)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/${{ github.repository }}/branches/main/protection" --input - <<'JSON'
          {
            "required_status_checks": null,
            "enforce_admins": false,
            "required_pull_request_reviews": null,
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_linear_history": true,
            "required_conversation_resolution": true
          }
          JSON
          echo "Branch protection applied to main."
