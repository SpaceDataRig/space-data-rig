name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Full history on purpose. tests/handoff-freshness.test.ts proves that every commit sha the handoff's
      # "Current state" section names is reachable from HEAD -- the check that catches a handover document citing a
      # rewritten or invented commit. actions/checkout defaults to fetch-depth: 1, which makes every ancestor
      # "unreachable" and turned that gate red for the wrong reason (CI run 39146663797). A shallow clone must not
      # be able to pass the gate by not knowing the answer.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (Node + Worker targets)
        run: npm run typecheck:all

      - name: Lint (blocking on errors)
        run: npm run lint

      # audit-17 Legacy 3: web/*.js is browser ESM that sits OUTSIDE both tsc targets (the Node target includes
      # src+scripts, the worker target src/cf) and outside eslint (which runs src tests scripts). A parse error in the
      # board code would therefore ship with nothing catching it, so gate it with node --check -- the same ESM parser
      # the module graph relies on. Style is deliberately NOT linted here (legacy browser code); this catches only
      # syntax failures, so it cannot cry wolf on formatting.
      - name: Web syntax gate (browser ESM not covered by tsc or eslint)
        run: for f in web/*.js; do node --check "$f" || exit 1; done

      # audit-6 P2: the real-MAST-FITS gates (tests/mast*, six tests) skip when out/probe-*.fits are absent,
      # and out/ is gitignored, so on a fresh checkout they never ran. Prefetch the same public products
      # through the production fetch code so those gates execute here; a hard download failure exits 1.
      - name: Prefetch real MAST probe FITS (external-data gates)
        run: npm run ci:probe-fits

      - name: Tests + coverage gate (auto-discovers tests/*.test.ts)
        run: npm run test:coverage

      - name: Dependency audit (advisory -- Dependabot owns remediation)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Format check (advisory -- one-time repo-wide format pending)
        run: npm run format:check
        continue-on-error: true
