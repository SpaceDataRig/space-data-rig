name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (Node + Worker targets)
        run: npm run typecheck:all

      - name: Lint (blocking on errors)
        run: npm run lint

      - name: Tests + coverage gate (auto-discovers tests/*.test.ts)
        run: npm run test:coverage

      - name: Dependency audit (advisory -- Dependabot owns remediation)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Format check (advisory -- one-time repo-wide format pending)
        run: npm run format:check
        continue-on-error: true
