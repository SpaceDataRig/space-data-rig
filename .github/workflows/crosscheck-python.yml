name: cross-pipeline-python

# Independent IMPLEMENTATION-level cross-check (Problem 3): re-analyze the committed real-curve fixtures with a
# pure-Python stack (batman injection + wotan detrending + astropy BoxLeastSquares, optional transitls) that shares
# no code with this repository's TypeScript detectors. The fixtures under tests/fixtures/spoc-curves/ are exported
# by `npm run p36:export-fixtures` from real public TESS-SPOC photometry and committed, so every run re-analyzes
# byte-identical input and the numbers are reproducible without network access to MAST.
#
# Triggers: manual dispatch, and pushes that touch the harness/fixtures (the main CI workflow covers everything
# else). Results are uploaded as artifacts AND published back into the repository (reports/crosscheck/) so the
# measured numbers are publicly readable without artifact authentication -- artifact/log download requires auth,
# committed files do not. The publish step cannot re-trigger this workflow (its paths filter excludes reports/),
# so there is no loop. Nothing here gates, anchors, claims, or deploys.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/cross_pipeline.py
      - scripts/benchmark_vs_field.py
      - tests/fixtures/spoc-curves/**
      - .github/workflows/crosscheck-python.yml

permissions:
  contents: write

jobs:
  cross-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # headroom; the wotan trend-reuse optimization (see cross_pipeline.py) cut the dominant
                          # detrending cost ~7x (84 -> 12 biweight fits), but CI machine speed varies run to run.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Python stack
        run: |
          python -m pip install --upgrade pip
          # Pinned for reproducibility; every version below was verified to exist on PyPI before pinning.
          # NOTE: batman's PyPI distribution name is batman-package (the import name is batman); TLS ships as
          # transitleastsquares. transitleastsquares is optional (the harness degrades gracefully if it breaks).
          pip install numpy==1.26.4 astropy==5.3.4 batman-package==2.4.9 wotan==1.9
          pip install transitleastsquares==2.0.1 || echo "transitleastsquares unavailable; harness will report TLS cells as MISSING"

      - name: Run cross-pipeline harness
        run: python scripts/cross_pipeline.py

      # Install LEO-Vetter ONLY after the cross-pipeline harness has run, so a dependency-resolution side effect
      # (e.g. it pulling a different numpy) cannot disturb the already-completed detection arm. A resolve/install
      # failure is tolerated: benchmark_vs_field.py imports it guarded and, if absent, still writes an honest
      # LEO-VETTER-MISSING report and exits 0 -- this step can never redden the job.
      - name: Install LEO-Vetter (external reference vetter)
        run: pip install leo-vetter || echo "leo-vetter unavailable; benchmark arm will report LEO-VETTER-MISSING"

      - name: Run benchmark-vs-field (LEO-Vetter) harness
        run: python scripts/benchmark_vs_field.py

      - name: Upload cross-pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-pipeline-report
          path: reports/crosscheck/
          if-no-files-found: warn

      - name: Publish measured report back to the repo
        if: always()
        run: |
          if [ -f reports/crosscheck/cross-pipeline.md ]; then
            git config user.name "sdr-bot"
            git config user.email "bot@spacedatarig.app"
            git fetch origin main --depth=1
            git checkout -B main origin/main
            git add reports/crosscheck
            if ! git diff --cached --quiet; then
              git commit -m "Track C: publish cross-pipeline report (run $GITHUB_RUN_ID, CI-measured)"
              git push origin HEAD:main
            else
              echo "report unchanged; nothing to publish"
            fi
          else
            echo "no report produced; nothing to publish"
          fi
