name: freshness-regen (re-stamp network-bound reports + rebuild the report library)

# Audit point #3 follow-up. The report-freshness gate (scripts/report-freshness.ts, applied by p86) marks a
# report HARD-STALE when a file its numbers were stamped against changed AFTER it was generated. Four reports
# derive from LIVE catalogs (ExoFOP ToI table, NASA Exoplanet Archive, MAST SPOC light curves) and their
# buildStamp covers tracked SOURCE files, so the moment those sources are edited -- e.g. the RA-unit fix in
# src/data/toiDispositions.ts, the crossmatch tri-state in src/data/exoplanetArchive.ts -- the checked-in
# reports go stale even though their science is unchanged. On a dev laptop the catalogs are often unreachable
# within the fetch timeout, so the honest fix is NOT to hand-edit the stamp or ship marked-red: it is to re-run
# the generators on a networked runner where ExoFOP/Gaia/MAST answer, let each re-emit buildStamp over the
# CURRENT tree, rebuild the report library, and PUBLISH the refreshed reports + web/reports/ back -- exactly the
# self-publish pattern scale-roc/veto-multisector/leo-vetter already use.
#
# SCOPE (four genuinely-network reports):
#   - p48 novelty-check         : fetchConfirmedPlanets + fetchTocCandidates (NASA Archive) over web/candidates.json
#   - p76 multisource-novelty   : fetchToiTable (ExoFOP, a multi-MB CSV the sandbox times out on)  -> was unstamped
#   - p92 scrambled-fa          : fetchSpocLightCurve (MAST S3) + fetchConfirmedPlanets (Archive)   -> was unstamped
#   - p59 offtarget-subset      : Gaia blend census (reads the committed p58 report, does NOT rerun p58) -> STALE after toiDispositions edit
# p48 and p76 both stamp web/candidates.json as an input, so a board republish by p22 HARD-STALEs them together --
# p48 is in this fleet precisely so a candidate-board flip re-stamps BOTH novelty reports on a runner where the
# Archive and ExoFOP answer, and the rebuilt library never carries a stale novelty report.
# NOTE ON p90: its numbers are baked into src/core/depthFormat.ts and the public depth cards, so a live re-measure
# (the Archive gains/loses rows between runs) silently MOVES a published figure -- this job caught one such drift
# (16 -> 6). p90 is therefore frozen against a committed snapshot and replayed OFFLINE/deterministically (see
# scripts/p90-depth-estimators.ts + reports/fixtures/p90-frozen-rows.json); it needs no networked runner and is
# deliberately NOT re-measured here, so a scheduled job can never gamble a cited number on when it happened to run.
# Nothing here gates, anchors, claims, or deploys. These are point-in-time measurements on real public data; the
# live catalog may have moved a handful of rows since the previous run -- that is precisely what the stamp records
# (a fresh generatedAt/gitSha), and the numbers stay honest because they are re-MEASURED, not copied. discoveryClaim
# remains structurally false.
#
# TRIGGERS: manual dispatch, and any push to main that edits one of the four networked generators, a tracked source
# their stamps cover, or web/candidates.json (the board p48/p76 read) -- so a candidate-board republish re-stamps the
# novelty reports on a networked runner instead of reappearing silently as STALE. Neither the publish commit (only
# reports/ and web/reports/, never web/candidates.json) nor this workflow's own definition is a trigger path, so
# neither can re-fire the fleet.

on:
  workflow_dispatch:
    inputs:
      p92_curves:
        description: "p92 scrambled-fa: host curves to scramble"
        required: true
        default: "10"
      p92_maxsectors:
        description: "p92 scrambled-fa: max sectors per curve"
        required: true
        default: "1"
  push:
    branches: [main]
    paths:
      - scripts/p76-multisource-novelty.ts
      - scripts/p48-novelty-check.ts
      - scripts/p92-scrambled-fa.ts
      - scripts/p59-offtarget-subset.ts
      - src/data/toiDispositions.ts
      - src/data/gaiaDilution.ts
      - src/data/mastS3.ts
      - src/candidate/novelty.ts
      - web/candidates.json

permissions:
  contents: write

# One refresh at a time; never cancel a running one (its published report is the artifact we want).
concurrency:
  group: freshness-regen
  cancel-in-progress: false

jobs:
  freshness-regen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # FAST arms first so a timeout still publishes whichever reports refreshed (the crosscheck-python starvation
      # lesson: never park an arm behind a longer one inside the same job).
      - name: Archive-only novelty snapshot (p48)
        run: npm run p48:novelty-check

      - name: Multi-source novelty snapshot vs live ExoFOP (p76)
        run: npm run p76:multisource-novelty

      - name: Scrambled false-alarm null on real MAST curves (p92)
        run: npm run p92:scrambled-fa -- --targets "${{ github.event.inputs.p92_curves || '10' }}" --maxsectors "${{ github.event.inputs.p92_maxsectors || '1' }}" --perCurve 3 --seed 7

      - name: Localization-addressable subset veto (p59, reads the committed p58 report)
        run: npm run p59:offtarget-subset -- --aperture 21 --min-sep 1.5

      - name: Rebuild the report library + freshness index from the refreshed reports
        # --allow-stale so a single catalog that refused to answer still publishes the OTHER three, marked honestly;
        # the publish summary below echoes how many remain stale so a red run is never a mystery.
        run: npm run p86:report-library -- --allow-stale

      - name: Publish refreshed reports + rebuilt library back to the repo
        if: always()
        # R6: the old step ran `git checkout -B main origin/main` AFTER the generators had already rewritten
        # reports/ and web/reports/ in the working tree. When a concurrent run (or the queue) had advanced
        # origin/main in the meantime, that checkout tried to move HEAD onto bytes that differ from the dirty
        # working files and ABORTED with "local changes would be overwritten" -- a red run even though the report
        # itself was fine. Commit first (never a destructive checkout), then bring in the remote with a MERGE that
        # lets OUR freshly-measured artifacts win on conflict, and retry the push if the remote moved again. The
        # publish commit only touches reports/ and web/reports/, neither of which is a trigger path, so this job
        # cannot re-fire itself.
        run: |
          git config user.name "sdr-bot"
          git config user.email "bot@spacedatarig.app"
          git add reports/p48-novelty.json reports/p48-novelty.md \
                  reports/p76-multisource-novelty.json reports/p76-multisource-novelty.md \
                  reports/p92-scrambled-fa.json reports/p92-scrambled-fa.md \
                  reports/p59-offtarget-subset.json reports/p59-offtarget-subset.md \
                  web/reports/ || true
          if git diff --cached --quiet; then echo "reports and index unchanged; nothing to publish"; exit 0; fi
          git commit -m "freshness-regen: re-stamp p48/p59/p76/p92 + rebuild report library (run $GITHUB_RUN_ID, CI-measured)"
          published=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main --quiet
            # -X ours keeps THIS run's regenerated bytes on any conflict: they are the current measurement, and a
            # concurrent publish of the same report must not overwrite them with an older one.
            if git merge origin/main --no-edit -X ours; then
              if git push origin HEAD:main; then published=1; break; fi
              echo "push raced (attempt $attempt); rebasing on the newer remote and retrying"
            else
              echo "merge raced (attempt $attempt)"; git merge --abort || true
            fi
            sleep 5
          done
          if [ "$published" != "1" ]; then echo "FAILED to publish after 5 attempts"; exit 1; fi
          node -e "const j=require('./web/reports/index.json');console.log('published freshness:',JSON.stringify(j.freshness))" || true
