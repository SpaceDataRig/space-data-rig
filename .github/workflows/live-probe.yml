name: Upstream live-probe (read-only)

# audit-10 #8: a weekly, keyless, READ-ONLY check that the three external data upstreams the science
# depends on (NASA Exoplanet Archive TAP, ExoFOP-TESS TOI table, Gaia archive TAP) still return the
# fields and row counts we assume. A schema or behaviour change on any of them is a silent science bug.
# The probe sends nothing and writes nothing -- it can only read. A HARD FAIL (schema / row-count drift)
# opens an issue; a transient network error does NOT (it just re-tries next week). Deliberately separate
# from CI/npm test, which must stay network-free and deterministic.

on:
  schedule:
    - cron: "37 4 * * 1" # ~04:37 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run upstream live-probe (read-only)
        # exit 0 = healthy / partial; exit 1 = a real schema or row-count drift; exit 2 = all-network, ignore.
        continue-on-error: true
        id: probe
        run: npm run p8:live-probe | tee probe.log

      - name: Record verdict
        id: verdict
        run: |
          if grep -q "VERDICT: FAIL" probe.log; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue on a schema drift
        if: steps.verdict.outputs.failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('probe.log', 'utf8');
            const body = [
              'The weekly upstream live-probe detected a **schema or row-count drift** on at least one',
              'external data source. A science assumption on that upstream is now unverified -- investigate',
              'before trusting results that depend on it.',
              '',
              'Probe output:',
              '```',
              log.trim(),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream live-probe FAIL (${new Date().toISOString().slice(0, 10)})`,
              body,
              labels: ['automated', 'data-source'],
            });

      - name: Fail the job so the badge goes red
        if: steps.verdict.outputs.failed == 'true'
        run: exit 1
