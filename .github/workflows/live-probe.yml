name: Upstream live-probe (read-only)

# audit-10 #8: a weekly, keyless, READ-ONLY check that the three external data upstreams the science
# depends on (NASA Exoplanet Archive TAP, ExoFOP-TESS TOI table, Gaia archive TAP) still return the
# fields and row counts we assume. A schema or behaviour change on any of them is a silent science bug.
# audit-6 #4 adds a FOURTH assertion -- SURVEY PROGRESS: between consecutive weekly runs the rotation
# cursor (surveyPass) MUST increase and distinctHosts MUST NOT decrease. This catches the "stuck" class
# that froze the survey for 22 hours and was discovered only by "the feed stopped posting" -- no gate fired.
# The previous sample is carried across runs in the Actions cache (no secrets, no writes to any repo/store).
# The probe sends nothing and writes nothing -- it can only read. A HARD FAIL (schema drift OR a frozen
# survey) opens an issue; a transient network error does NOT (it just re-tries next week). Deliberately
# separate from CI/npm test, which must stay network-free and deterministic.

on:
  schedule:
    - cron: "37 4 * * 1" # ~04:37 UTC every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore the last survey-progress sample
        # A unique key (so this run always saves) with a rolling restore-prefix (so it restores the most
        # recent prior sample regardless of run id). The probe reads --prev-file and rewrites the same path
        # with the current numbers; the cache post-step then persists them for next Monday's run.
        uses: actions/cache@v4
        with:
          path: live-progress
          key: live-progress-${{ github.run_id }}
          restore-keys: live-progress-

      - name: Run live-probe (external upstreams + survey progress, read-only)
        # exit 0 = healthy / partial; exit 1 = a schema drift OR a frozen survey; exit 2 = all-network, ignore.
        continue-on-error: true
        id: probe
        run: |
          mkdir -p live-progress
          npm run p8:live-probe -- --prev-file live-progress/sample.json --out-file live-progress/sample.json | tee probe.log

      - name: Record verdict
        id: verdict
        run: |
          if grep -q "VERDICT: FAIL" probe.log; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue on a schema drift
        if: steps.verdict.outputs.failed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('probe.log', 'utf8');
            const body = [
              'The weekly live-probe detected a **schema/row-count drift on an external upstream, or a',
              'frozen survey** (surveyPass not advancing / distinctHosts regressing). Either means a science',
              'assumption is now unverified or the autonomous survey has stopped making progress -- investigate',
              'before trusting results that depend on it.',
              '',
              'Probe output:',
              '```',
              log.trim(),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Upstream live-probe FAIL (${new Date().toISOString().slice(0, 10)})`,
              body,
              labels: ['automated', 'data-source'],
            });

      - name: Fail the job so the badge goes red
        if: steps.verdict.outputs.failed == 'true'
        run: exit 1
