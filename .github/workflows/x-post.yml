name: x-post (half-hourly English science digest)

# audit-6: DIGEST posting, not per-push. This channel used to fire on EVERY qualifying push, so a run of
# consecutive commits produced a run of consecutive tweets with no ordering at all. It is now a digest that runs
# every 30 minutes and posts EVERY item the window actually holds: one post per science tier that has something,
# plus one build note per batch of unreported commits.
#
# VOLUME IS DELIBERATELY NOT RATIONED. The earlier "at most ONE line per window" rule was written as a spam guard
# and ended up dropping reportable work -- a five-commit push produced one build note covering one commit, and a
# window that both sealed a result and landed commits reported only the result. What is left are feed PROTECTIONS,
# not rations: per-item de-duplication (identical text is never posted twice in a run), a generous runaway cap
# (MAX_POSTS_PER_RUN, default 25 -- far above what a real window yields), and a short delay between posts
# (POST_DELAY_S) so a big backlog cannot trip X's own rate limit. Raise or lower those by env; do not reintroduce
# a one-post cap.
#
# Science, not commits: the science tiers report what the rig produced -- a result sealed on-chain, a newly
# flagged UNCONFIRMED blind candidate, or a research milestone -- composed by scripts/science-digest.ts
# (composeDigest, unit-tested in tests/science-digest.test.ts) from the LIVE rig state (/api/state + /api/ledger)
# plus the committed web/research.json. The build-note tier reports development progress over the commit backlog.
# Each post is English and text-only long-form (the author is a Premium/"blue" account, so a post may run past 280
# chars up to X's 25,000-char long-post ceiling). No image (AI illustration is generated only inside an agent
# session, never in CI).
# No Chinese (the workflow strips non-ASCII and scripts/post-x-text.ts refuses any non-ASCII byte, so
# English-only is enforced twice). A window with no new science is not automatically silent: the build-note tier
# is composed on its own cursor regardless of what the science tiers did, and only when NOTHING was composed does
# the run fall back -- if also silent past HEARTBEAT_AFTER_MIN (default 45m) -- to an honest status heartbeat
# (silence watchdog below; scripts/x-last-post.ts reads the newest tweets), so a quiet stretch is not mistaken for
# downtime. It NEVER posts an empty tweet and NEVER claims a discovered planet -- a blind candidate is always
# "UNCONFIRMED ... for human follow-up" -- and honesty is carried by plain wording, not a per-post stamp.
#
# VERIFYING THIS CHANNEL (a lesson earned the hard way): composeDigest's tiers are unit-tested, but the SHELL that
# drives them -- cursor parsing, the batch loop, the posting loop -- is CI-only and no test loads it, so a green
# `npm test` proves nothing about it (a pipefail abort and an illegal max_results both shipped undetected). Before
# editing, run `bash scripts/verify-xpost-shell.sh`; dispatch dry_heartbeat=1 to exercise the watchdog WITHOUT
# posting; and after deploying, read the NEXT scheduled run's job log -- every cursor is echoed on every run
# precisely so it can be checked from a run where a tier never fires. (An inverted window -- a future --since with
# no --until -- makes composeDigest return "" at its guard before the heartbeat tier, so it does NOT exercise the
# fallback.)

# Cursors and guards:
#  - No push trigger: a push never posts on its own. The half-hourly digest is the only automatic path.
#  - THREE cursors, because each tier fires under different conditions and a shared cursor silently drops work:
#      science  = newest tweet that is neither a build note nor a heartbeat (x-last-post `last_science`);
#      dev      = newest BUILD NOTE on the feed (`last_build_note`), minus DEV_OVERLAP_MIN;
#      silence  = newest tweet of any kind (`last_post`), used only to measure the gap for the heartbeat.
#    A build note posted seconds AFTER the science data was fetched must not push the science window forward, or
#    anything created in between is never reported -- the same defect class as the starved dev tier, one level up.
#    The dev overlap re-reads a few minutes of commits it may already have covered; composeDigest drops any subject
#    the feed has already announced (x-last-post --reported-out), so the overlap recovers mid-run commits without
#    repeating a bullet.
#  - Posts are ordered oldest-commit-first and the loop BREAKS on the first posting failure, so the newest work is
#    what remains for the next window: a partial run under-reports, it never over-reports or drops.
#  - concurrency-grouped with cancel-in-progress:false, so overlapping ticks queue instead of racing.
#  - COST, without rationing volume: a dependency-free pre-flight (scripts/x-post-preflight.mjs) stops the job
#    BEFORE `npm ci` when the window provably holds nothing, and the installed tree is cached against the
#    lockfile so a run that DOES have work skips the install on a cache hit. Neither changes WHAT is posted or
#    HOW OFTEN: the pre-flight only ever skips a window it is sure is empty (any untrusted input makes it
#    proceed), and composeDigest still decides everything on any run that gets past it. The redundant GitHub
#    `on.schedule` backup and the full-history checkout are deliberately KEPT -- with the pre-flight in place a
#    redundant backup tick exits after a clone and two cheap HTTPS reads, and the full history is load-bearing
#    for the research.json milestone gate and for build-note windows whose cursor is older than a shallow
#    clone would reach.
#  - The posting script is DRY-RUN unless the four X_API_* secrets are set -- inert until an operator opts in;
#    no key ever enters the repo.

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (at :00 and :30 UTC)
  workflow_dispatch:
    inputs:
      text:
        description: "override the digest text (blank = compose the science digest since the last run)"
        required: false
        default: ""
      since:
        description: "override the look-back window start (ISO 8601, or a git date like '2 hours ago')"
        required: false
        default: ""
      maxlen:
        description: "length ceiling for a manual text override (blank = 280; a Premium author may probe up to 25000)"
        required: false
        default: ""
      dry_heartbeat:
        description: "set to 1 to compose a status heartbeat and validate it WITHOUT posting (verification only)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read # to read this workflow's own previous run time (the digest cursor)

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a large backlog posts several items with a delay between them; 5 was sized for one
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so `git log --since` can count the whole window

      # Rolling cache of the three feed cursors the previous run read off the timeline. The pre-flight below
      # uses it as a HINT only; the run re-reads the live feed later, so a stale hint can never drop a post.
      # MUST run AFTER checkout: checkout's default `git clean -ffdx` deletes untracked files, so restoring
      # before it would have the clean wipe the hint and the pre-flight would always see "no cached cursors".
      - name: Restore feed cursors (pre-flight hint only)
        uses: actions/cache/restore@v4
        with:
          path: out/x-cursors.json
          key: xc-${{ github.run_id }}
          restore-keys: xc-

      # Cost gate. Most half-hour windows hold nothing reportable; without this step every one of them still
      # paid for a full dependency install, a live-feed read and an X timeline read. The pre-flight answers
      # "could this window hold anything?" from the cached cursors + two cheap HTTPS reads + local git, and
      # only when it is SURE the answer is no does the job stop here (skip=1 gates every step below). It is
      # conservative by construction: any missing or untrusted input makes it proceed. See the script header.
      - name: Pre-flight (stop before installing when the window provably holds nothing)
        id: preflight
        env:
          CURSOR_FILE: out/x-cursors.json
          HEARTBEAT_AFTER_MIN: "45"
          DEV_OVERLAP_MIN: "10"
          DEV_COMMIT_EXCLUDE: "^chore\\(deps"
          OVERRIDE_TEXT: ${{ github.event.inputs.text }}
          OVERRIDE_SINCE: ${{ github.event.inputs.since }}
          DRY_HEARTBEAT: ${{ github.event.inputs.dry_heartbeat }}
        run: |
          set -uo pipefail
          # Manual overrides and the verification path always take the full pipeline.
          if [ -n "$OVERRIDE_TEXT" ] || [ -n "$OVERRIDE_SINCE" ] || [ "$DRY_HEARTBEAT" = "1" ]; then
            echo "preflight: manual override / verification -> full path"
            echo "skip=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/x-post-preflight.mjs
          code=$?
          if [ "$code" -eq 42 ]; then
            echo "preflight: window provably empty -> skipping install + compose + post"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - uses: actions/setup-node@v7
        if: steps.preflight.outputs.skip != '1'
        with:
          node-version: 22
          cache: npm

      # Installed tree cached against the lockfile, so a run that DOES have work skips `npm ci` entirely on a
      # cache hit. Kept separate from setup-node's download cache, which still unpacks the tree every time.
      - name: Restore node_modules
        id: nm
        if: steps.preflight.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install (skipped on a node_modules cache hit)
        if: steps.preflight.outputs.skip != '1' && steps.nm.outputs.cache-hit != 'true'
        run: npm ci

      - name: Compose every reportable item in the window and post each one
        if: steps.preflight.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          CUR: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          OVERRIDE_TEXT: ${{ github.event.inputs.text }}
          OVERRIDE_SINCE: ${{ github.event.inputs.since }}
          OVERRIDE_MAXLEN: ${{ github.event.inputs.maxlen }}
          # credentials come ONLY from secrets; absent -> the script dry-runs and sends nothing
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # Silence watchdog: when a run composes NOTHING and the account has been quiet this many minutes,
          # composeDigest falls back to an honest status heartbeat so a long gap is not read as downtime.
          HEARTBEAT_AFTER_MIN: "45"
          DRY_HEARTBEAT: ${{ github.event.inputs.dry_heartbeat }}
          # --- Volume controls. These are FEED PROTECTIONS, not rations: no one-post-per-window cap exists. ---
          # How many commit subjects one run will even look at. A runaway guard for a pathological backlog
          # (e.g. a history rewrite), not a ration: a normal window holds a handful.
          DEV_COMMITS_MAX: "200"
          # Bullets per build note. The backlog is split into chunks of this size and EVERY chunk is posted, so
          # raising the backlog raises the post count rather than truncating the list. Must stay under
          # DEV_BULLETS_MAX in scripts/science-digest.ts (a test reads this default and asserts it).
          DEV_BATCH: "24"
          # Ceiling on posts in one run, far above what a real window yields. Leftover items are not lost: the
          # loop posts oldest-commit-first and breaks, so the cursors still point before the unsent work.
          MAX_POSTS_PER_RUN: "25"
          # Pause between posts so a large backlog cannot trip X's own rate limit mid-run.
          POST_DELAY_S: "5"
          # Minutes the dev window reaches back PAST its cursor. Commits landing while a run is in flight would
          # otherwise fall behind the new cursor and never be reported; composeDigest de-duplicates against the
          # subjects already on the feed, so the overlap cannot repeat a bullet.
          DEV_OVERLAP_MIN: "10"
          # Look-back used only when the feed holds no build note at all (fresh account, or a read failure).
          BUILD_NOTE_LOOKBACK_H: "48"
          # Subjects to leave out of the build note. Defaults to dependency-bot version churn only -- set to an
          # empty string to report literally every commit. NOTE: `docs:` is no longer excluded; documentation is
          # part of the work and was being silently dropped.
          DEV_COMMIT_EXCLUDE: "^chore\\(deps"
        run: |
          set -uo pipefail
          if [ -n "$OVERRIDE_TEXT" ]; then
            TEXT="$(printf '%s' "$OVERRIDE_TEXT" | tr -cd '\11\12\15\40-\176')"
            MAXLEN_ARG=""
            if [ -n "$OVERRIDE_MAXLEN" ]; then MAXLEN_ARG="--max-len=$OVERRIDE_MAXLEN"; fi
            echo "posting override (maxlen=${OVERRIDE_MAXLEN:-280}): $TEXT"
            npm run x:post -- --text "$TEXT" $MAXLEN_ARG
            exit 0
          fi
          # Verification path (default off): compose a heartbeat and validate it, then STOP -- never posts. Forces
          # the fallback branch (empty window + a silence gap past the threshold) so the heartbeat tier -- the one
          # live traffic rarely reaches -- can be exercised on demand without spamming the feed.
          if [ "$DRY_HEARTBEAT" = "1" ]; then
            echo "dry_heartbeat=1 -> composing a heartbeat for validation ONLY (no post)"
            # A VALID but EMPTY window (far-past since+until): composeDigest returns "" for an inverted window via
            # its guard, so we cannot force the fallback with a future --since. A past window is valid (end>start)
            # yet holds no science -> the tiers fall through to the heartbeat, which the silence gap then triggers.
            npm run science:digest -- --since 1970-01-01T00:00:00Z --until 1970-01-02T00:00:00Z --research-updated 0 --silent-min 100000 --heartbeat-after-min 90 --out out/dryhb.txt || true
            if [ ! -s out/dryhb.txt ]; then
              echo "##[error]dry_heartbeat produced no text -- the heartbeat tier did not fire"; exit 1
            fi
            RAW="$(cat out/dryhb.txt)"
            CLEAN="$(printf '%s' "$RAW" | tr -cd '\11\12\15\40-\176')"
            if [ "$RAW" != "$CLEAN" ]; then
              echo "##[error]dry_heartbeat contained non-ASCII bytes"; exit 1
            fi
            echo "---- dry heartbeat text (NOT posted) ----"
            printf '%s\n' "$RAW"
            echo "---- end: ASCII-only, $(printf '%s' "$RAW" | wc -c | tr -d ' ') bytes ----"
            exit 0
          fi
          # Read the account's recent tweets ONCE up front. That yields THREE cursors: the newest post of any kind
          # (measures the silence for the heartbeat), the newest SCIENCE post (anchors the science window) and the
          # newest BUILD NOTE (anchors the dev window). It also writes the subjects already announced on the feed,
          # which is what makes the dev window's overlap safe. It MUST NOT abort the run: stdout/stderr/exit go to
          # temp files with an explicit `|| echo`, and the values are pulled with `|| true`. x-last-post prints only
          # fixed, credential-free diagnostics to stderr. With no creds / on failure every value stays empty and
          # every consumer below falls back gracefully.
          mkdir -p out/posts
          rm -f out/posts/*.txt out/devchunk-* out/dev-*.txt out/reported-subjects.txt 2>/dev/null || true
          LP_OUT="$(mktemp)"; LP_ERR="$(mktemp)"
          npm run --silent x:lastpost -- --reported-out out/reported-subjects.txt >"$LP_OUT" 2>"$LP_ERR" || echo "x:lastpost exited non-zero (read failed; see stderr)"
          echo "x:lastpost stderr: $(tr -cd '\11\12\15\40-\176' < "$LP_ERR" | tr '\n' ' ' | head -c 300)"
          # Labelled parsing, not a bare-timestamp grep: with several cursors on one stream, `grep -Eo <ISO> | tail -1`
          # would silently hand one tier's time to another's window.
          LAST_POST_ISO="$(sed -n 's/^last_post=//p' "$LP_OUT" | tail -1 || true)"
          LAST_BUILD_NOTE_ISO="$(sed -n 's/^last_build_note=//p' "$LP_OUT" | tail -1 || true)"
          LAST_SCIENCE_ISO="$(sed -n 's/^last_science=//p' "$LP_OUT" | tail -1 || true)"
          # Tolerate the previous single-timestamp stdout shape, so an older ref dispatched against this workflow
          # still yields a usable cursor instead of degrading to the run-start fallback.
          if [ -z "$LAST_POST_ISO" ]; then
            LAST_POST_ISO="$(grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[^ "]*Z' "$LP_OUT" | head -1 || true)"
          fi
          # No science post on the page -> fall back to the newest tweet of any kind. A WIDER science window is the
          # safe direction: the science tiers filter on record timestamps, so re-scanning reports nothing twice and
          # drops nothing, whereas a cursor pushed too far forward loses results permanently.
          if [ -z "$LAST_SCIENCE_ISO" ]; then LAST_SCIENCE_ISO="$LAST_POST_ISO"; fi
          rm -f "$LP_OUT" "$LP_ERR"
          # Window start = when we LAST ACTUALLY POSTED SCIENCE, NOT when the last run happened and NOT when the last
          # build note went out. The old cursor used the previous run's start, so any run that posted nothing marched
          # the cursor forward and science that landed in between was skipped FOREVER. Anchoring to the last post
          # makes the window self-healing across skipped / failed / throttled runs. It must also skip build notes and
          # heartbeats: a run now posts several items, so a build note sent seconds AFTER the science data was
          # fetched would otherwise push the window past that fetch and drop anything created in between.
          # Fallback order: an override --since, else the last science post, else the previous run start (Actions
          # API), else ~40m. Normalize to ISO 8601 so git and the digest agree on the exact same window.
          SINCE_RAW="$OVERRIDE_SINCE"
          if [ -z "$SINCE_RAW" ] && [ -n "$LAST_SCIENCE_ISO" ]; then SINCE_RAW="$LAST_SCIENCE_ISO"; fi
          if [ -z "$SINCE_RAW" ]; then
            SINCE_RAW="$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/x-post.yml/runs?status=completed&per_page=10" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s).workflow_runs||[];const cur=process.env.CUR;const p=r.find(x=>String(x.id)!==cur);process.stdout.write(p?(p.run_started_at||p.created_at||""):"")}catch(e){process.stdout.write("")}})' || true)"
          fi
          SINCE=""
          if [ -n "$SINCE_RAW" ]; then SINCE="$(date -u -d "$SINCE_RAW" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)"; fi
          if [ -z "$SINCE" ]; then SINCE="$(date -u -d '40 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"; fi
          echo "digest window since: $SINCE (science cursor: ${LAST_SCIENCE_ISO:-unknown}; last post of any kind: ${LAST_POST_ISO:-unknown})"
          # DEV-TIER cursor: the newest BUILD NOTE on the feed, minus an overlap, else a bounded look-back. Two-step
          # arithmetic (epoch then re-format) rather than `date -d "<iso> N minutes ago"`, whose combined
          # absolute+relative form GNU date does not parse reliably. Deliberately NOT $SINCE -- that is what starved
          # this tier when the cursors were shared.
          DEV_SINCE=""
          if [ -n "$LAST_BUILD_NOTE_ISO" ]; then
            NOTE_EPOCH="$(date -u -d "$LAST_BUILD_NOTE_ISO" +%s 2>/dev/null || true)"
            if [ -n "$NOTE_EPOCH" ]; then
              DEV_SINCE="$(date -u -d "@$(( NOTE_EPOCH - ${DEV_OVERLAP_MIN:-10} * 60 ))" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)"
            fi
          fi
          if [ -z "$DEV_SINCE" ]; then DEV_SINCE="$(date -u -d "${BUILD_NOTE_LOOKBACK_H:-48} hours ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)"; fi
          if [ -z "$DEV_SINCE" ]; then DEV_SINCE="$SINCE"; fi
          # Logged on EVERY run, not only inside a branch that may not fire, so each cursor is verifiable from any
          # job log -- including a run where the tier that owns it composed nothing.
          echo "build-note cursor: dev window since $DEV_SINCE (last build note: ${LAST_BUILD_NOTE_ISO:-none found}, overlap ${DEV_OVERLAP_MIN:-10}m)"
          # Persist the three cursors for the NEXT run's pre-flight hint. Written from the values actually read
          # off the feed this run, so the hint is never newer than the truth: a stale hint can only make the
          # next pre-flight proceed, never skip a real post.
          printf '%s\n' "{\"last_post\":\"${LAST_POST_ISO}\",\"last_science\":\"${LAST_SCIENCE_ISO}\",\"last_build_note\":\"${LAST_BUILD_NOTE_ISO}\"}" > out/x-cursors.json || true
          # A research milestone may be reported ONLY when web/research.json actually landed in this window; the
          # digest script is told via --research-updated so it never re-posts a stale metric.
          RESEARCH_COMMITS="$(git log HEAD --no-merges --since="$SINCE" --pretty=%H -- web/research.json | wc -l | tr -d ' ')"
          RESEARCH_UPDATED=0
          if [ "$RESEARCH_COMMITS" -gt 0 ]; then RESEARCH_UPDATED=1; fi
          echo "research.json commits in window: $RESEARCH_COMMITS (researchUpdated=$RESEARCH_UPDATED)"

          # ---- Compose EVERY tier independently. No tier suppresses another, and the filename order IS the post
          # order. Each invocation asks for ONE tier (--only) and writes its own file; an empty file means that tier
          # had nothing honest to report and the posting loop skips it. --skip-fetch on the build note keeps it
          # working even when the live rig is unreachable: it needs git history, not survey state.
          npm run science:digest -- --since "$SINCE" --research-updated "$RESEARCH_UPDATED" --only ledger --out out/posts/00-ledger.txt || true
          npm run science:digest -- --since "$SINCE" --research-updated "$RESEARCH_UPDATED" --only blind --out out/posts/02-blind.txt || true
          npm run science:digest -- --since "$SINCE" --research-updated "$RESEARCH_UPDATED" --only milestone --out out/posts/04-milestone.txt || true

          # ---- Build note: the WHOLE unreported backlog, batched. Nothing is truncated to a fixed handful, and
          # `docs:` commits are no longer filtered out -- documentation is part of the work and was being dropped.
          # The excluded PATHS are generated artifacts (the published research-data file, the report/out trees),
          # which would otherwise bury the real changes; subject filtering is DEV_COMMIT_EXCLUDE.
          git log HEAD --no-merges --since="$DEV_SINCE" --pretty=%s -- ':!web/research.json' ':!reports/**' ':!out/**' > out/dev-all.txt || true
          head -n "${DEV_COMMITS_MAX:-200}" out/dev-all.txt > out/dev-capped.txt || true
          if [ -n "${DEV_COMMIT_EXCLUDE:-}" ]; then
            grep -Evi "$DEV_COMMIT_EXCLUDE" out/dev-capped.txt > out/dev-new.txt || true
          else
            cp out/dev-capped.txt out/dev-new.txt
          fi
          DEV_N="$(wc -l < out/dev-new.txt | tr -d ' ')"
          echo "build-note backlog: $DEV_N unreported commit subject(s) since $DEV_SINCE (batch ${DEV_BATCH:-24}, look-back cap ${DEV_COMMITS_MAX:-200}, exclude '${DEV_COMMIT_EXCLUDE:-none}')"
          if [ "$DEV_N" -gt 0 ]; then
            # OLDEST FIRST. git log lists newest first; reverse it so the posting loop -- which BREAKS on the first
            # failure -- leaves the NEWEST work unsent rather than the oldest. Unsent newest work is still ahead of
            # the dev cursor and is re-composed next window; unsent oldest work would sit behind it and be lost.
            tac out/dev-new.txt > out/dev-oldest.txt
            rm -f out/devchunk-* 2>/dev/null || true
            split -l "${DEV_BATCH:-24}" -d -a 3 out/dev-oldest.txt out/devchunk-
            NOTE_I=10
            for c in $(ls out/devchunk-* 2>/dev/null | sort); do
              [ -s "$c" ] || continue
              npm run science:digest -- --since "$DEV_SINCE" --research-updated "$RESEARCH_UPDATED" --only build-note \
                --dev-commits-file "$c" --already-reported-file out/reported-subjects.txt --skip-fetch 1 \
                --out "out/posts/${NOTE_I}-note.txt" || true
              NOTE_I=$((NOTE_I + 1))
            done
            echo "build note: composed $((NOTE_I - 10)) batch file(s) from $DEV_N subject(s)"
          fi

          # ---- Silence watchdog (fallback ONLY): reached when nothing at all was composed. If any tier produced a
          # post the channel is by definition not silent, so a heartbeat must not stack on top of real content.
          COMPOSED="$(find out/posts -type f -name '*.txt' -size +0c 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$COMPOSED" = "0" ]; then
            HB_MIN="${HEARTBEAT_AFTER_MIN:-45}"
            SILENT_MIN=""
            if [ -n "$LAST_POST_ISO" ]; then
              EPOCH="$(date -u -d "$LAST_POST_ISO" +%s 2>/dev/null || true)"
              if [ -n "$EPOCH" ]; then SILENT_MIN="$(( ( $(date -u +%s) - EPOCH ) / 60 ))"; fi
            fi
            if [ -n "$SILENT_MIN" ]; then
              echo "nothing composed; channel silent ${SILENT_MIN} min (heartbeat threshold ${HB_MIN})"
              npm run science:digest -- --since "$SINCE" --research-updated "$RESEARCH_UPDATED" --only heartbeat --silent-min "$SILENT_MIN" --heartbeat-after-min "$HB_MIN" --out out/posts/99-heartbeat.txt || true
            else
              echo "nothing composed; could not read last-post time (X read unavailable) -> skipping, no heartbeat"
            fi
          fi

          # ---- Per-tier manifest, echoed on EVERY run. Until now the log could say which tiers POSTED but not
          # which tiers were ATTEMPTED, so "this tier had nothing honest to report" was indistinguishable from
          # "this tier was never run" -- the exact blind spot that let a 22-hour survey freeze go unnoticed.
          # An empty file means attempted-and-empty; `not-attempted` means the compose step never produced one.
          tm_bytes() {
            local hit=0 tot=0 x n
            for x in $1; do
              [ -e "$x" ] || continue
              hit=$((hit + 1))
              n="$(wc -c < "$x" | tr -d ' ')"
              tot=$((tot + n))
            done
            if [ "$hit" = "0" ]; then printf 'not-attempted'; else printf '%s file(s) %s byte(s)' "$hit" "$tot"; fi
          }
          echo "tier manifest: ledger [$(tm_bytes 'out/posts/00-ledger.txt')] blind [$(tm_bytes 'out/posts/02-blind.txt')] milestone [$(tm_bytes 'out/posts/04-milestone.txt')] note [$(tm_bytes 'out/posts/1[0-9]-note.txt')] heartbeat [$(tm_bytes 'out/posts/99-heartbeat.txt')]"

          # ---- Post every composed item. There is NO one-post-per-window cap: only a runaway ceiling,
          # byte-identical de-duplication, and a delay so a large backlog cannot trip X's own rate limit. ----
          CAP="${MAX_POSTS_PER_RUN:-25}"
          DELAY="${POST_DELAY_S:-5}"
          SENT=0
          SEEN="$(mktemp)"
          QUEUED="$(find out/posts -type f -name '*.txt' -size +0c 2>/dev/null | sort)"
          NQUEUED="$(printf '%s\n' "$QUEUED" | grep -c . || true)"
          echo "posting $NQUEUED composed item(s); runaway ceiling $CAP, delay ${DELAY}s between posts"
          for f in $QUEUED; do
            if [ "$SENT" -ge "$CAP" ]; then
              echo "##[warning]runaway ceiling reached ($CAP posted this run); the remaining items stay ahead of the cursors for the next window"
              break
            fi
            # strip any non-ASCII once more; English-only is enforced in the posting script too
            TEXT="$(printf '%s' "$(cat "$f")" | tr -cd '\11\12\15\40-\176')"
            if [ -z "$TEXT" ]; then continue; fi
            KEY="$(printf '%s' "$TEXT" | sha256sum | cut -d' ' -f1)"
            if grep -qxF "$KEY" "$SEEN" 2>/dev/null; then
              echo "skip $f: byte-identical to an item already posted in this run"
              continue
            fi
            printf '%s\n' "$KEY" >> "$SEEN"
            if [ "$SENT" -gt 0 ]; then sleep "$DELAY" || true; fi
            echo "posting item $((SENT + 1)) (of up to $CAP) from $f: $TEXT"
            # --max-len 25000: the author is a Premium ("blue") account and these are LONG-FORM posts (well past 280
            # chars); without this the posting script's default ceiling would silently truncate.
            if npm run x:post -- --text "$TEXT" --max-len 25000; then
              SENT=$((SENT + 1))
            else
              # BREAK, never continue: the cursors are read off the feed, so a LATER successful post would advance
              # them past this unsent item and drop it for good. Stopping leaves everything unsent ahead of the
              # cursor, so the next window re-composes it.
              echo "##[error]x:post failed on $f; stopping the loop so the cursors do not advance past an unsent item"
              break
            fi
          done
          rm -f "$SEEN"
          if [ "$SENT" = "0" ]; then
            echo "nothing reportable in this window; posted nothing (never posts an empty tweet)"
          else
            echo "posted $SENT item(s) this run"
          fi

      - name: Save node_modules for the next run
        if: steps.preflight.outputs.skip != '1' && steps.nm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Save feed cursors for the next pre-flight
        if: always() && steps.preflight.outputs.skip != '1'
        uses: actions/cache/save@v4
        with:
          path: out/x-cursors.json
          key: xc-${{ github.run_id }}
