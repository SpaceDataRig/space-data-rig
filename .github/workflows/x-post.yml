name: x-post (half-hourly English science digest)

# audit-6: BATCHED posting. This channel used to fire on EVERY qualifying push, so a run of consecutive
# commits produced a run of consecutive tweets (too noisy). It is now a DIGEST that runs every 30 minutes.
# Science, not commits: the digest reports the single most important SCIENCE the rig produced since the
# previous run -- a result sealed on-chain, a newly flagged UNCONFIRMED blind candidate, or a research
# milestone -- composed by scripts/science-digest.ts (composeDigest, unit-tested in tests/science-digest.test.ts)
# from the LIVE rig state (/api/state + /api/ledger) plus the committed web/research.json. It posts at most ONE
# English, text-only long-form post (the author is a Premium/"blue" account, so a digest may run past 280 chars
# up to X's 25,000-char long-post ceiling). No image (AI illustration is generated only inside an agent session,
# never in CI).
# No Chinese (the workflow strips non-ASCII and scripts/post-x-text.ts refuses any non-ASCII byte, so
# English-only is enforced twice). A window with NO new science is not automatically silent: it may post a BUILD
# NOTE over the commits since the last post (a development-progress tier); only when there is neither new science
# nor a buildable commit does it fall back -- if also silent past HEARTBEAT_AFTER_MIN (default 90m) -- to an honest
# status heartbeat (silence watchdog below; scripts/x-last-post.ts reads the newest tweet), so a quiet stretch is not
# mistaken for downtime. It NEVER posts an empty tweet and NEVER claims a discovered planet -- a blind candidate is
# always "UNCONFIRMED ... for human follow-up" -- and honesty is carried by plain wording, not a per-post stamp.
#
# VERIFYING THIS CHANNEL (a lesson earned the hard way): the compose + watchdog path only runs when a window has
# NO new science, so unit tests + a green `npm test` do NOT exercise it and CI stays green even when it is broken
# (a pipefail abort and an illegal max_results both shipped undetected). Before editing this workflow, dispatch
# dry_heartbeat=1 (composes + validates a heartbeat WITHOUT posting) and/or a run with a VALID but empty window
# (past --since AND --until) to force the watchdog branch, then read the job log; that, not the test count, is the
# real gate. (An inverted window -- a future --since with no --until -- makes composeDigest return "" at its guard
# before the heartbeat tier, so it does NOT exercise the fallback.)

# Loop / spam guards:
#  - No push trigger: a push never posts on its own. The half-hourly digest is the only automatic path, and one
#    window yields AT MOST ONE line -- a science post, else a BATCHED build note over the window's commits, else a
#    heartbeat. Commit coverage is batched (never per-commit), and the last-post cursor means one commit is never
#    re-reported across windows.
#  - concurrency-grouped with cancel-in-progress:false, so overlapping ticks queue instead of racing.
#  - The posting script is DRY-RUN unless the four X_API_* secrets are set -- inert until an operator opts in;
#    no key ever enters the repo.

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (at :00 and :30 UTC)
  workflow_dispatch:
    inputs:
      text:
        description: "override the digest text (blank = compose the science digest since the last run)"
        required: false
        default: ""
      since:
        description: "override the look-back window start (ISO 8601, or a git date like '2 hours ago')"
        required: false
        default: ""
      maxlen:
        description: "length ceiling for a manual text override (blank = 280; a Premium author may probe up to 25000)"
        required: false
        default: ""
      dry_heartbeat:
        description: "set to 1 to compose a status heartbeat and validate it WITHOUT posting (verification only)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read # to read this workflow's own previous run time (the digest cursor)

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so `git log --since` can count the whole window

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Compose the science digest since the last run and post ONE English line
        env:
          GH_TOKEN: ${{ github.token }}
          CUR: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          OVERRIDE_TEXT: ${{ github.event.inputs.text }}
          OVERRIDE_SINCE: ${{ github.event.inputs.since }}
          OVERRIDE_MAXLEN: ${{ github.event.inputs.maxlen }}
          # credentials come ONLY from secrets; absent -> the script dry-runs and sends nothing
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # Silence watchdog: when a scheduled run finds NO new science AND the account has been quiet this many
          # minutes, composeDigest falls back to an honest status heartbeat so a long gap is not read as downtime.
          HEARTBEAT_AFTER_MIN: "90"
          DRY_HEARTBEAT: ${{ github.event.inputs.dry_heartbeat }}
        run: |
          set -uo pipefail
          if [ -n "$OVERRIDE_TEXT" ]; then
            TEXT="$(printf '%s' "$OVERRIDE_TEXT" | tr -cd '\11\12\15\40-\176')"
            MAXLEN_ARG=""
            if [ -n "$OVERRIDE_MAXLEN" ]; then MAXLEN_ARG="--max-len=$OVERRIDE_MAXLEN"; fi
            echo "posting override (maxlen=${OVERRIDE_MAXLEN:-280}): $TEXT"
            npm run x:post -- --text "$TEXT" $MAXLEN_ARG
            exit 0
          fi
          # Verification path (default off): compose a heartbeat and validate it, then STOP -- never posts. Forces
          # the fallback branch (empty window + a silence gap past the threshold) so the heartbeat tier -- the one
          # live traffic rarely reaches -- can be exercised on demand without spamming the feed.
          if [ "$DRY_HEARTBEAT" = "1" ]; then
            echo "dry_heartbeat=1 -> composing a heartbeat for validation ONLY (no post)"
            # A VALID but EMPTY window (far-past since+until): composeDigest returns "" for an inverted window via
            # its guard, so we cannot force the fallback with a future --since. A past window is valid (end>start)
            # yet holds no science -> the tiers fall through to the heartbeat, which the silence gap then triggers.
            npm run science:digest -- --since 1970-01-01T00:00:00Z --until 1970-01-02T00:00:00Z --research-updated 0 --silent-min 100000 --heartbeat-after-min 90 --out out/dryhb.txt || true
            if [ ! -s out/dryhb.txt ]; then
              echo "##[error]dry_heartbeat produced no text -- the heartbeat tier did not fire"; exit 1
            fi
            RAW="$(cat out/dryhb.txt)"
            CLEAN="$(printf '%s' "$RAW" | tr -cd '\11\12\15\40-\176')"
            if [ "$RAW" != "$CLEAN" ]; then
              echo "##[error]dry_heartbeat contained non-ASCII bytes"; exit 1
            fi
            echo "---- dry heartbeat text (NOT posted) ----"
            printf '%s\n' "$RAW"
            echo "---- end: ASCII-only, $(printf '%s' "$RAW" | wc -c | tr -d ' ') bytes ----"
            exit 0
          fi
          # Read the account's newest tweet ONCE up front. That timestamp does two jobs: it anchors the digest
          # window to the last ACTUAL post (not the last run), and it measures the silence for the heartbeat. It
          # MUST NOT abort the run: the step is `set -eo pipefail`, so stdout/stderr/exit go to temp files with an
          # explicit `|| echo`, and the ISO is pulled with `|| true`. x-last-post prints only fixed, credential-free
          # diagnostics to stderr. With no creds / on failure LAST_POST_ISO stays empty and every consumer below
          # falls back gracefully.
          LP_OUT="$(mktemp)"; LP_ERR="$(mktemp)"
          npm run --silent x:lastpost >"$LP_OUT" 2>"$LP_ERR" || echo "x:lastpost exited non-zero (read failed; see stderr)"
          echo "x:lastpost stderr: $(tr -cd '\11\12\15\40-\176' < "$LP_ERR" | tr '\n' ' ' | head -c 300)"
          LAST_POST_ISO="$(grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[^ "]*Z' "$LP_OUT" | tail -1 || true)"
          rm -f "$LP_OUT" "$LP_ERR"
          # Window start = when we LAST ACTUALLY POSTED (newest tweet), NOT when the last run happened. The old
          # cursor used the previous run's start, so any run that posted nothing -- an empty-science tick, or a
          # dry_heartbeat / verification dispatch -- marched the cursor forward and science that landed between the
          # last tweet and that no-op run was skipped FOREVER (this is why real, already-sealed results went quiet
          # even though the survey kept producing them). Anchoring to the last post makes the window self-healing
          # across skipped / failed / throttled runs: nothing is dropped until it has actually been reported.
          # Fallback order: an override --since, else the last post, else the previous run start (Actions API),
          # else ~40m. Normalize to ISO 8601 so git and the digest agree on the exact same window.
          SINCE_RAW="$OVERRIDE_SINCE"
          if [ -z "$SINCE_RAW" ] && [ -n "$LAST_POST_ISO" ]; then SINCE_RAW="$LAST_POST_ISO"; fi
          if [ -z "$SINCE_RAW" ]; then
            SINCE_RAW="$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/x-post.yml/runs?status=completed&per_page=10" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s).workflow_runs||[];const cur=process.env.CUR;const p=r.find(x=>String(x.id)!==cur);process.stdout.write(p?(p.run_started_at||p.created_at||""):"")}catch(e){process.stdout.write("")}})' || true)"
          fi
          SINCE=""
          if [ -n "$SINCE_RAW" ]; then SINCE="$(date -u -d "$SINCE_RAW" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)"; fi
          if [ -z "$SINCE" ]; then SINCE="$(date -u -d '40 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"; fi
          echo "digest window since: $SINCE (last actual post: ${LAST_POST_ISO:-unknown})"
          # A research milestone may be reported ONLY when web/research.json actually landed in this window; the
          # digest script is told via --research-updated so it never re-posts a stale metric.
          RESEARCH_COMMITS="$(git log HEAD --no-merges --since="$SINCE" --pretty=%H -- web/research.json | wc -l | tr -d ' ')"
          RESEARCH_UPDATED=0
          if [ "$RESEARCH_COMMITS" -gt 0 ]; then RESEARCH_UPDATED=1; fi
          echo "research.json commits in window: $RESEARCH_COMMITS (researchUpdated=$RESEARCH_UPDATED)"
          # Compose ONE honest English long-form science post, or an EMPTY file when there is nothing new to report.
          npm run science:digest -- --since "$SINCE" --research-updated "$RESEARCH_UPDATED" --out out/digest.txt || true
          # Build-note tier (development progress): when a window has NO new science, offer a plain-English update
          # over the commits since the LAST POST -- excluding the generated research-data file and the reports/out
          # trees, and skipping pure chore/docs noise. composeDigest sanitizes every line (drops any that would break
          # a red line: spend/wallet/key/time-words), so an all-noise list yields nothing and we fall through.
          if [ ! -s out/digest.txt ]; then
            git log HEAD --no-merges --since="$SINCE" --pretty=%s -- ':!web/research.json' ':!reports/**' ':!out/**' \
              | grep -Eiv '^(chore|docs?)(\([a-z0-9-]+\))?:' | head -5 > out/dev-commits.txt || true
            if [ -s out/dev-commits.txt ]; then
              echo "no new science; build note over $(wc -l < out/dev-commits.txt | tr -d ' ') commit(s) since the last post"
              npm run science:digest -- --since "$SINCE" --research-updated "$RESEARCH_UPDATED" --dev-commits-file out/dev-commits.txt --out out/digest.txt || true
            fi
          fi
          # Silence watchdog (fallback only): if there was NO new science, use the last-post time already read to
          # see how long the channel has been quiet (a human post counts too); past the threshold, compose an
          # honest status heartbeat instead of staying silent -- a quiet stretch is not downtime.
          if [ ! -s out/digest.txt ]; then
            HB_MIN="${HEARTBEAT_AFTER_MIN:-90}"
            SILENT_MIN=""
            if [ -n "$LAST_POST_ISO" ]; then
              EPOCH="$(date -u -d "$LAST_POST_ISO" +%s 2>/dev/null || true)"
              if [ -n "$EPOCH" ]; then SILENT_MIN="$(( ( $(date -u +%s) - EPOCH ) / 60 ))"; fi
            fi
            if [ -n "$SILENT_MIN" ]; then
              echo "no new science; channel silent ${SILENT_MIN} min (heartbeat threshold ${HB_MIN})"
              npm run science:digest -- --since "$SINCE" --research-updated "$RESEARCH_UPDATED" --silent-min "$SILENT_MIN" --heartbeat-after-min "$HB_MIN" --out out/digest.txt || true
            else
              echo "no new science; could not read last-post time (X read unavailable) -> skipping, no heartbeat"
            fi
          fi
          if [ -s out/digest.txt ]; then
            # strip any non-ASCII once more; English-only is enforced in the posting script too
            TEXT="$(printf '%s' "$(cat out/digest.txt)" | tr -cd '\11\12\15\40-\176')"
            echo "posting: $TEXT"
            # --max-len 25000: the author is a Premium ("blue") account and the digest is now a LONG-FORM summary
            # (>280 chars); without this the posting script's default 280 ceiling would silently truncate it.
            npm run x:post -- --text "$TEXT" --max-len 25000
          else
            echo "no new science result in this window; skipping (never posts an empty tweet)"
          fi
