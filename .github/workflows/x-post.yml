name: x-post (half-hourly English science digest)

# audit-6: BATCHED posting. This channel used to fire on EVERY qualifying push, so a run of consecutive
# commits produced a run of consecutive tweets (too noisy). It is now a DIGEST that runs every 30 minutes.
# Science, not commits: the digest reports the single most important SCIENCE the rig produced since the
# previous run -- a result sealed on-chain, a newly flagged UNCONFIRMED blind candidate, or a research
# milestone -- composed by scripts/science-digest.ts (composeDigest, unit-tested in tests/science-digest.test.ts)
# from the LIVE rig state (/api/state + /api/ledger) plus the committed web/research.json. It posts at most ONE
# English, text-only long-form post (the author is a Premium/"blue" account, so a digest may run past 280 chars
# up to X's 25,000-char long-post ceiling). No image (AI illustration is generated only inside an agent session,
# never in CI).
# No Chinese (the workflow strips non-ASCII and scripts/post-x-text.ts refuses any non-ASCII byte, so
# English-only is enforced twice). A window with NO new result normally posts NOTHING (no empty tweet) -- UNLESS
# the channel has been silent past HEARTBEAT_AFTER_MIN (default 90m), when it falls back to an honest status
# heartbeat (silence watchdog below; scripts/x-last-post.ts reads the newest tweet) so a quiet stretch is not
# mistaken for downtime. It NEVER claims a discovered planet -- a blind candidate is always
# "UNCONFIRMED ... for human follow-up".

# Loop / spam guards:
#  - No push trigger at all: committing docs/reports no longer posts per-commit; the half-hourly digest is the
#    only automatic path, and one window yields AT MOST ONE science line (or nothing at all).
#  - concurrency-grouped with cancel-in-progress:false, so overlapping ticks queue instead of racing.
#  - The posting script is DRY-RUN unless the four X_API_* secrets are set -- inert until an operator opts in;
#    no key ever enters the repo.

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (at :00 and :30 UTC)
  workflow_dispatch:
    inputs:
      text:
        description: "override the digest text (blank = compose the science digest since the last run)"
        required: false
        default: ""
      since:
        description: "override the look-back window start (ISO 8601, or a git date like '2 hours ago')"
        required: false
        default: ""
      maxlen:
        description: "length ceiling for a manual text override (blank = 280; a Premium author may probe up to 25000)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read # to read this workflow's own previous run time (the digest cursor)

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so `git log --since` can count the whole window

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Compose the science digest since the last run and post ONE English line
        env:
          GH_TOKEN: ${{ github.token }}
          CUR: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          OVERRIDE_TEXT: ${{ github.event.inputs.text }}
          OVERRIDE_SINCE: ${{ github.event.inputs.since }}
          OVERRIDE_MAXLEN: ${{ github.event.inputs.maxlen }}
          # credentials come ONLY from secrets; absent -> the script dry-runs and sends nothing
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # Silence watchdog: when a scheduled run finds NO new science AND the account has been quiet this many
          # minutes, composeDigest falls back to an honest status heartbeat so a long gap is not read as downtime.
          HEARTBEAT_AFTER_MIN: "90"
        run: |
          set -uo pipefail
          if [ -n "$OVERRIDE_TEXT" ]; then
            TEXT="$(printf '%s' "$OVERRIDE_TEXT" | tr -cd '\11\12\15\40-\176')"
            MAXLEN_ARG=""
            if [ -n "$OVERRIDE_MAXLEN" ]; then MAXLEN_ARG="--max-len=$OVERRIDE_MAXLEN"; fi
            echo "posting override (maxlen=${OVERRIDE_MAXLEN:-280}): $TEXT"
            npm run x:post -- --text "$TEXT" $MAXLEN_ARG
            exit 0
          fi
          # Window start = when the PREVIOUS completed x-post run started (a self-healing cursor via the Actions
          # API): if a tick is delayed or skipped, the next window stretches to cover the gap so no result is
          # silently dropped. Normalize to ISO 8601 UTC so `git log --since` and the digest script agree on the
          # exact same window. On lookup failure / no prior run, fall back to ~40m (a slightly-late tick cannot
          # leave an uncovered sliver).
          SINCE_RAW="$OVERRIDE_SINCE"
          if [ -z "$SINCE_RAW" ]; then
            SINCE_RAW="$(curl -sfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/x-post.yml/runs?status=completed&per_page=10" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const r=JSON.parse(s).workflow_runs||[];const cur=process.env.CUR;const p=r.find(x=>String(x.id)!==cur);process.stdout.write(p?(p.run_started_at||p.created_at||""):"")}catch(e){process.stdout.write("")}})' || true)"
          fi
          SINCE=""
          if [ -n "$SINCE_RAW" ]; then SINCE="$(date -u -d "$SINCE_RAW" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || true)"; fi
          if [ -z "$SINCE" ]; then SINCE="$(date -u -d '40 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"; fi
          echo "digest window since: $SINCE"
          # A research milestone may be reported ONLY when web/research.json actually landed in this window; the
          # digest script is told via --research-updated so it never re-posts a stale metric.
          RESEARCH_COMMITS="$(git log HEAD --no-merges --since="$SINCE" --pretty=%H -- web/research.json | wc -l | tr -d ' ')"
          RESEARCH_UPDATED=0
          if [ "$RESEARCH_COMMITS" -gt 0 ]; then RESEARCH_UPDATED=1; fi
          echo "research.json commits in window: $RESEARCH_COMMITS (researchUpdated=$RESEARCH_UPDATED)"
          # Compose ONE honest English long-form science post, or an EMPTY file when there is nothing new to report.
          npm run science:digest -- --since "$SINCE" --research-updated "$RESEARCH_UPDATED" --out out/digest.txt
          # Silence watchdog (fallback only): if there was NO new science, read the account's newest tweet to learn
          # how long the channel has actually been quiet (a human post also counts), and past the threshold let the
          # digest compose an honest status heartbeat instead of staying silent -- a quiet stretch is not downtime.
          if [ ! -s out/digest.txt ]; then
            HB_MIN="${HEARTBEAT_AFTER_MIN:-90}"
            LAST_POST_ISO="$(npm run --silent x:lastpost 2>/dev/null | grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[^ "]*Z' | tail -1)"
            SILENT_MIN=""
            if [ -n "$LAST_POST_ISO" ]; then
              EPOCH="$(date -u -d "$LAST_POST_ISO" +%s 2>/dev/null || true)"
              if [ -n "$EPOCH" ]; then SILENT_MIN="$(( ( $(date -u +%s) - EPOCH ) / 60 ))"; fi
            fi
            if [ -n "$SILENT_MIN" ]; then
              echo "no new science; channel silent ${SILENT_MIN} min (heartbeat threshold ${HB_MIN})"
              npm run science:digest -- --since "$SINCE" --research-updated "$RESEARCH_UPDATED" --silent-min "$SILENT_MIN" --heartbeat-after-min "$HB_MIN" --out out/digest.txt
            else
              echo "no new science; could not read last-post time (X read unavailable) -> skipping, no heartbeat"
            fi
          fi
          if [ -s out/digest.txt ]; then
            # strip any non-ASCII once more; English-only is enforced in the posting script too
            TEXT="$(printf '%s' "$(cat out/digest.txt)" | tr -cd '\11\12\15\40-\176')"
            echo "posting: $TEXT"
            # --max-len 25000: the author is a Premium ("blue") account and the digest is now a LONG-FORM summary
            # (>280 chars); without this the posting script's default 280 ceiling would silently truncate it.
            npm run x:post -- --text "$TEXT" --max-len 25000
          else
            echo "no new science result in this window; skipping (never posts an empty tweet)"
          fi
