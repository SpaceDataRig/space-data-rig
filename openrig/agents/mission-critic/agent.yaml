name: mission-critic
version: "1.0"
description: Mission Critic seat -- cross-matches the catalog, applies sanity checks and issues the verdict.

defaults:
  runtime: codex
  lifecycle:
    execution_mode: interactive_resident
    compaction_strategy: default-compaction
    restore_policy: resume_if_possible

profiles:
  default:
    summary: Standard review and adjudication operations.
    uses:
      skills: []
      guidance: []
      subagents: []
      plugins: []
      runtime_resources: []

resources:
  guidance:
    - id: role
      path: guidance/role.md

startup:
  files:
    - path: guidance/role.md
      delivery_hint: send_text
      required: true
  actions: []
