<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#0b1020"/><text x="28" y="44" font-size="21" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">scienceHash reaches the chain -- decoded from Solana mainnet, not our database</text><text x="28" y="70" font-size="13" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">The third-round audit found the content address was computed but never actually written on-chain. After the fix + deploy, we re-read the real transactions.</text><rect x="28" y="100" width="560" height="250" rx="16" fill="#141b33" stroke="#26314f"/><text x="50" y="130" font-size="17" fill="#ff6b6b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">Before (pre-deploy anchors)</text><text x="50" y="162" font-size="14" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">sdr:1 | finding | bundleHash</text><text x="50" y="186" font-size="12.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">3 fields -- no content address on the chain.</text><text x="50" y="224" font-size="13" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">F-HAT-P-11-b</text><text x="220" y="224" font-size="13" fill="#ff6b6b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">3 fields</text><text x="340" y="224" font-size="12" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">Oct 12</text><text x="50" y="252" font-size="13" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">F-pi-Men-c</text><text x="220" y="252" font-size="13" fill="#ff6b6b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">3 fields</text><text x="340" y="252" font-size="12" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">Oct 12</text><text x="50" y="280" font-size="13" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">F-KELT-9-b</text><text x="220" y="280" font-size="13" fill="#ff6b6b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">3 fields</text><text x="340" y="280" font-size="12" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">Oct 12</text><text x="50" y="316" font-size="12" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">Immutable history -- these stay 3-field by design, and that is correct.</text><rect x="612" y="100" width="560" height="250" rx="16" fill="#141b33" stroke="#26314f"/><text x="634" y="130" font-size="17" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">After (first post-deploy anchors)</text><text x="634" y="162" font-size="14" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">sdr:1 | finding | bundleHash | scienceHash</text><text x="634" y="186" font-size="12.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">4 fields -- the content address is now on-chain.</text><text x="634" y="224" font-size="13" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">F-HR-858-b</text><text x="804" y="224" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">4 fields</text><text x="924" y="224" font-size="12" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">Oct 16 02:16</text><text x="634" y="252" font-size="13" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">F-HR-858-d</text><text x="804" y="252" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">4 fields</text><text x="924" y="252" font-size="12" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">Oct 16 02:18</text><text x="634" y="280" font-size="13" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">F-WASP-189-b</text><text x="804" y="280" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">4 fields</text><text x="924" y="280" font-size="12" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">Oct 16 02:21</text><text x="634" y="316" font-size="12" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">bundleHash still at position 2 -&gt; verification unaffected (match).</text><rect x="28" y="372" width="1144" height="210" rx="16" fill="#141b33" stroke="#26314f"/><text x="50" y="402" font-size="17" fill="#5aa9ff" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">How this is verified (no admin token, no spend)</text><text x="50" y="436" font-size="13" fill="#e8ecf7" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">1  Read the public /api/ledger to list anchored rows and their transaction signatures.</text><text x="50" y="464" font-size="13" fill="#e8ecf7" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">2  Re-read each transaction straight from the Solana mainnet RPC (jsonParsed), decode the SPL Memo string.</text><text x="50" y="492" font-size="13" fill="#e8ecf7" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">3  Count the pipe-delimited fields; cross-check position 2 equals the stored bundleHash.</text><text x="50" y="520" font-size="13" fill="#e8ecf7" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">4  The chain itself is the source of truth -- a database field is not proof of what was written on-chain.</text><text x="50" y="556" font-size="13" fill="#9fb0d6" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">Reproduce it:  npm run p9:decode-memo  (read-only)  //  spacedatarig.app</text></svg>
