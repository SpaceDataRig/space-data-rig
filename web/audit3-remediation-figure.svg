<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#0b1020"/><text x="28" y="44" font-size="21" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">Audit-3: half-done items closed, two new defects fixed, limits made explicit</text><text x="28" y="70" font-size="13" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">A third review confirmed 8 of 11 prior fixes were real. We fixed what was half-done, added two missing wirings, and stated what the method cannot do.</text><rect x="28" y="96" width="660" height="470" rx="16" fill="#141b33" stroke="#26314f"/><text x="50" y="126" font-size="18" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">Third-round findings -&gt; this pass</text><text x="50" y="152" font-size="13.5" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">A</text><text x="74" y="152" font-size="11.5" fill="#ff6b6b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">DEFECT</text><text x="160" y="152" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">scienceHash was computed but never hit the chain; memos differed by runtime.</text><text x="74" y="189" font-size="11.5" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">FIXED</text><text x="160" y="189" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">threaded scienceHash through the one shared submit primitive (f34d672).</text><text x="50" y="226" font-size="13.5" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">B</text><text x="74" y="226" font-size="11.5" fill="#ff6b6b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">DEFECT</text><text x="160" y="226" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">identical science re-anchored as 3 mainnet txs -- repeat spend on one content.</text><text x="74" y="263" font-size="11.5" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">FIXED</text><text x="160" y="263" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">dedup by scienceHash before paying; no foreign stamp, invariant holds (9dcf908).</text><text x="50" y="300" font-size="13.5" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">C</text><text x="74" y="300" font-size="11.5" fill="#ff6b6b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">DEFECT</text><text x="160" y="300" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">legacy bundles still render the old overclaiming wording, immutable by design.</text><text x="74" y="337" font-size="11.5" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">FIXED</text><text x="160" y="337" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">render-layer derived relabel for pre-policy cards; rule in README (be553ed).</text><text x="50" y="374" font-size="13.5" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">D</text><text x="74" y="374" font-size="11.5" fill="#ff6b6b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">DEFECT</text><text x="160" y="374" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">rate limiter per-isolate + fail-open (true as of snapshot 584c1e47).</text><text x="74" y="411" font-size="11.5" fill="#f5b544" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">SHIPPED</text><text x="160" y="411" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">global DO, in-memory counters (reset on eviction); landed ~23 min later (34e93b8).</text><text x="50" y="448" font-size="13.5" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">E</text><text x="74" y="448" font-size="11.5" fill="#ff6b6b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">GAP</text><text x="160" y="448" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">a probe that exists is not a probe that alerts -- failure mode untested.</text><text x="74" y="485" font-size="11.5" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">FIXED</text><text x="160" y="485" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">pure judge + offline self-test: drifted fixtures trip the alert code (97cddc6).</text><text x="50" y="522" font-size="13.5" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">F</text><text x="74" y="522" font-size="11.5" fill="#ff6b6b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">MISLABEL</text><text x="160" y="522" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">we said Blocked (no Python) -- wrong, CI runs Python; real limit is TRICERATOPS starfield.</text><text x="74" y="559" font-size="11.5" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">CORRECTED</text><text x="160" y="559" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">ledger now Partial; capability boundary published, not threshold-tuned.</text><rect x="704" y="96" width="472" height="232" rx="16" fill="#141b33" stroke="#26314f"/><text x="726" y="126" font-size="17" fill="#5aa9ff" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">Capability boundary (stated, not sold)</text><text x="726" y="156" font-size="13" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">Blended / multi-source-per-pixel scenes are unsupported.</text><text x="726" y="180" font-size="12.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">Centroid false-positive test caught 0/59 labelled blends;</text><text x="726" y="198" font-size="12.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">~70% of those targets never localise a cross-sector offset.</text><text x="726" y="222" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">Pixel-baseline-bound -- a method rebuild, not a threshold.</text><text x="726" y="254" font-size="12.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">Accepted-precision 42.2% at 425 curves is the wall;</text><text x="726" y="272" font-size="12.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">recall 86.2% is printed alongside, never alone.</text><text x="726" y="306" font-size="12.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">The $SDR token is isolated: no verdict reads from it.</text><rect x="704" y="344" width="472" height="222" rx="16" fill="#141b33" stroke="#26314f"/><text x="726" y="374" font-size="17" fill="#f5b544" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">Verification gate (this pass)</text><text x="726" y="406" font-size="13" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">typecheck:all / typecheck:worker</text><text x="1080" y="406" font-size="14" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">exit 0</text><text x="726" y="436" font-size="13" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">npm test (offline, auto-discovered)</text><text x="1080" y="436" font-size="14" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">all green</text><text x="726" y="466" font-size="13" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">eslint --max-warnings 0</text><text x="1080" y="466" font-size="14" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">exit 0</text><text x="726" y="496" font-size="13" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">live-probe offline self-test</text><text x="1080" y="496" font-size="14" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">PASS</text><text x="726" y="526" font-size="13" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">CI on main</text><text x="1080" y="526" font-size="14" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">passing</text><text x="726" y="552" font-size="13" fill="#9fb0d6" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">safeToGate false   discoveryClaim false</text></svg>
