<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="792" viewBox="0 0 1200 792"><rect width="1200" height="792" fill="#0b1020"/><text x="28" y="44" font-size="21" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">Audit-4: two fixes were deployed but never fired on real data -- now they do, proven live</text><text x="28" y="70" font-size="13" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">A fourth review re-tested the audit-3 fixes on the live site. Two were green in CI yet inert in production, because a non-science field was folded into a hash.</text><rect x="28" y="96" width="672" height="668" rx="16" fill="#141b33" stroke="#26314f"/><text x="50" y="128" font-size="17" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">The 'deployed but inert' class -- before vs after (LIVE-measured)</text><text x="50" y="164" font-size="13.5" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">1  scienceHash dedup -- was DEAD CODE</text><text x="66" y="186" font-size="11.5" fill="#ff6b6b" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">BEFORE  F-HR-858-b/c/d (one detection, three labels) -&gt; 3 distinct hashes -&gt; 3 mainnet fees</text><text x="66" y="206" font-size="11.5" fill="#37d39b" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">AFTER   -&gt; 1 content address 78357350... -&gt; dedup fires, no repeat fee</text><text x="50" y="242" font-size="13.5" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">2  legacy 'Confirmed:' relabel -- OFF-BY-ONE-DAY</text><text x="66" y="264" font-size="11.5" fill="#ff6b6b" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">BEFORE  created &lt; 2026-10-12 excluded every live card -&gt; 0 of 4 annotated</text><text x="66" y="284" font-size="11.5" fill="#37d39b" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">AFTER   created &lt;=  -&gt; 4 of 4 annotated (WASP-121, HD 189733, KELT-9, GJ 1214)</text><text x="50" y="320" font-size="13.5" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">3  GET /api/events -- returned 500</text><text x="66" y="342" font-size="11.5" fill="#ff6b6b" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">BEFORE  plain GET forwarded with an injected Upgrade header -&gt; Worker exception 500</text><text x="66" y="362" font-size="11.5" fill="#37d39b" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">AFTER   worker checks Upgrade first -&gt; 426 Upgrade Required</text><text x="50" y="398" font-size="13.5" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">4  an honest dedup showed as FAILURE in the UI</text><text x="66" y="420" font-size="11.5" fill="#ff6b6b" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">BEFORE  {ok:true, deduplicated:true} fell through to 'anchor failed'</text><text x="66" y="440" font-size="11.5" fill="#37d39b" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">AFTER   'no new tx -- identical science already anchored as F-HR-858-b'; button 'Deduplicated'</text><text x="50" y="476" font-size="13.5" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">5  one run re-fetched the same curve per catalog row</text><text x="66" y="498" font-size="11.5" fill="#ff6b6b" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">BEFORE  three rows on one star -&gt; three identical FITS downloads (three dataHashes)</text><text x="66" y="518" font-size="11.5" fill="#37d39b" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">AFTER   run-scoped byte cache keyed by tic+sector, labelled per row -&gt; one download</text><text x="50" y="560" font-size="12" fill="#f5b544" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">Common root cause: the test asserted a FUNCTION on a hand-built stub, never that the</text><text x="50" y="580" font-size="12" fill="#f5b544" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">PREDICATE processes the REAL production records -- so both shipped green and inert.</text><text x="50" y="608" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">Defect C history wording also corrected: remediated ~23 min AFTER the audit-3 snapshot</text><text x="50" y="626" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">(34e93b8 00:55Z vs 584c1e47 00:32Z), and it is a global DO with in-memory counters, not SQLite.</text><rect x="716" y="96" width="456" height="320" rx="16" fill="#141b33" stroke="#26314f"/><text x="738" y="128" font-size="17" fill="#5aa9ff" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">The root gate this round adds</text><text x="738" y="160" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">hashScience folded findingId / targetId /</text><text x="738" y="180" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">artifacts / dataProvenance -- and a post-hoc</text><text x="738" y="200" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">truth check -- into the content address.</text><text x="738" y="228" font-size="12.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">Now scienceProjection() hashes ONLY the blind</text><text x="738" y="248" font-size="12.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">science + the gating checks.</text><text x="738" y="280" font-size="12.5" fill="#37d39b" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">NEW GATE  capture-live-fixtures snapshots the</text><text x="738" y="300" font-size="12.5" fill="#37d39b" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">live /api/state + manifests; live-data-regression</text><text x="738" y="320" font-size="12.5" fill="#37d39b" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">drives the REAL predicates over the REAL bytes.</text><text x="738" y="352" font-size="12" fill="#f5b544" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">Measuring real data even corrected the audit's</text><text x="738" y="372" font-size="12" fill="#f5b544" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">own field list: checks[6] 'period-vs-truth (post-</text><text x="738" y="392" font-size="12" fill="#f5b544" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">hoc, non-gating)' differs per label, so including</text><text x="738" y="410" font-size="12" fill="#f5b544" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">it verbatim would have kept the dedup dead.</text><rect x="716" y="432" width="456" height="332" rx="16" fill="#141b33" stroke="#26314f"/><text x="738" y="464" font-size="17" fill="#f5b544" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">Verification gate + live proof (this pass)</text><text x="738" y="498" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">typecheck:all / worker</text><text x="1080" y="498" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">exit 0</text><text x="738" y="528" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">npm test (offline)</text><text x="1080" y="528" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">481 / 481</text><text x="738" y="558" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">eslint --max-warnings 0</text><text x="1080" y="558" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">exit 0</text><text x="738" y="588" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">non-ASCII / secret scan</text><text x="1080" y="588" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">0</text><text x="738" y="618" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">LIVE GET /api/events</text><text x="1080" y="618" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">426</text><text x="738" y="648" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">LIVE relabel on /api/state</text><text x="1080" y="648" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">4 / 4 cards</text><text x="738" y="678" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">LIVE trio scienceHash</text><text x="1080" y="678" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">1 distinct</text><text x="738" y="714" font-size="12" fill="#9fb0d6" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">deploy Version b2806cfa   commit b891b51</text><text x="738" y="738" font-size="12.5" fill="#9fb0d6" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">safeToGate false    discoveryClaim false</text></svg>
