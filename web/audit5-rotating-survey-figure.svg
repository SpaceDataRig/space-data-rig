<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#0b1020"/><text x="28" y="44" font-size="20" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">Audit-5: the catalog was static by design -- it now rotates a growing, honestly-labeled survey</text><text x="28" y="70" font-size="12.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">A reader asked why FINDINGS CATALOG never changed. The honest root cause, the fix, and the guardrails that stop a livelier catalog from reading as a discovery claim.</text><rect x="28" y="96" width="660" height="636" rx="16" fill="#141b33" stroke="#26314f"/><text x="50" y="128" font-size="18" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">Root cause -&gt; fix</text><text x="50" y="154" font-size="12.5" fill="#ff6b6b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">WHY STATIC</text><text x="120" y="154" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">Every cron pass picked the brightest N KNOWN planets; findingId is deterministic</text><text x="50" y="184" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">(F-&lt;target&gt;) and recordFinding is INSERT OR REPLACE -- the same rows were rewritten in</text><text x="50" y="214" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">place every 15 min, so the catalog could not grow. It was churn, not stasis.</text><text x="50" y="244" font-size="12.5" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">FIX 1</text><text x="120" y="244" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">The autonomous run now ROTATES a broad real pool from a persisted survey cursor</text><text x="50" y="274" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">(src/survey/rotation.ts + DO meta surveyPass, advanced once/pass, idempotent by runId),</text><text x="50" y="304" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">so new rows accumulate across passes. Manual dashboard runs stay deterministic top-N.</text><text x="50" y="334" font-size="12.5" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">FIX 2</text><text x="120" y="334" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">UNCONFIRMED TOI candidates run through the SAME 5-seat pipeline on REAL SPOC</text><text x="50" y="364" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">pixels, BLIND (the TOI ephemeris is withheld) -- the same protocol as p7, which</text><text x="50" y="394" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">independently recovered 27/70 unconfirmed candidates offline at a 0.22% median period error.</text><text x="50" y="424" font-size="12.5" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">FIX 3</text><text x="120" y="424" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">The genuinely novel work used to live only in offline reports. The live survey now</text><text x="50" y="454" font-size="11.5" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">reaches it: real unconfirmed candidates appear in the catalog, labeled as candidates.</text><rect x="704" y="96" width="472" height="348" rx="16" fill="#141b33" stroke="#26314f"/><text x="726" y="126" font-size="17" fill="#5aa9ff" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">Guardrails -- why this is not 'inflation'</text><text x="726" y="156" font-size="12" fill="#e8ecf7" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">Every row carries Finding.origin:</text><text x="726" y="176" font-size="12" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">  'revalidation'  a known planet re-derived</text><text x="726" y="196" font-size="12" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">  'blind-toi'     an UNCONFIRMED candidate</text><text x="726" y="216" font-size="12" fill="#e8ecf7" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">critique() caps blind-toi at needs-more-data</text><text x="726" y="236" font-size="12" fill="#e8ecf7" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">even when the evidence alone would accept it.</text><text x="726" y="256" font-size="12" fill="#e8ecf7" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">The auto-anchor branch refuses blind-toi too --</text><text x="726" y="276" font-size="12" fill="#e8ecf7" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">a blind candidate is NEVER sealed or claimed.</text><text x="726" y="296" font-size="12" fill="#e8ecf7" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">A TOI with no real SPOC photometry is SKIPPED,</text><text x="726" y="316" font-size="12" fill="#e8ecf7" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">never given a synthetic stand-in that could fake</text><text x="726" y="336" font-size="12" fill="#e8ecf7" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">a 'recovery'.</text><text x="726" y="356" font-size="12" fill="#e8ecf7" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">origin is NOT in the bundle manifest, so it moves</text><text x="726" y="376" font-size="12" fill="#e8ecf7" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">no bundleHash / scienceHash -- behavior-tested.</text><rect x="704" y="460" width="472" height="272" rx="16" fill="#141b33" stroke="#26314f"/><text x="726" y="490" font-size="17" fill="#f5b544" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">Verification gate + deploy (this pass)</text><text x="726" y="520" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">typecheck:all / worker</text><text x="1140" y="520" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">exit 0</text><text x="726" y="548" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">npm test (offline)</text><text x="1140" y="548" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">487 / 487</text><text x="726" y="576" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">eslint --max-warnings 0</text><text x="1140" y="576" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">exit 0</text><text x="726" y="604" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">non-ASCII / secret scan</text><text x="1140" y="604" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">0</text><text x="726" y="632" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">new behavior tests</text><text x="1140" y="632" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">6 added</text><text x="726" y="660" font-size="12.5" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">deploy Version</text><text x="1140" y="660" font-size="13" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">f4dfb1a9</text><text x="726" y="692" font-size="12" fill="#9fb0d6" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">commit 15c7857   discoveryClaim false</text><text x="726" y="714" font-size="12" fill="#9fb0d6" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">safeToGate path unchanged for blind candidates</text></svg>
