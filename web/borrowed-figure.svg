<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" font-family="ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="#0b1220"/>
  <text x="24" y="30" fill="#e7f0ff" font-size="18" font-weight="700">Borrowing from a real TESS survey: two vetting levers, measured before gated</text>
  <text x="24" y="48" fill="#9fb4d4" font-size="11">Every number re-derived from a committed P73/P74 report; positive controls on known planets; nothing gated, anchored or claimed (discoveryClaim = false).</text>
  <rect x="24" y="66" width="444" height="300" rx="10" fill="#111a2e" stroke="#22304d"/><text x="40" y="92" fill="#e7f0ff" font-size="14.5" font-weight="700">P73 | Mask siblings, re-find?</text><text x="40" y="109" fill="#9fb4d4" font-size="10.5">Borrowed: mask each catalogued neighbour, then re-search</text><text x="174" y="143" fill="#9fb4d4" font-size="10.5" text-anchor="end">SINGLE (per-sector)</text><rect x="182" y="128" width="50.0" height="22" rx="3" fill="#8fc6ff"/><text x="239.0" y="143" fill="#e7f0ff" font-size="11.5" font-weight="600">4/20</text><text x="174" y="177" fill="#9fb4d4" font-size="10.5" text-anchor="end">NAIVE-JOINT (stitched)</text><rect x="182" y="162" width="75.0" height="22" rx="3" fill="#8fc6ff"/><text x="264.0" y="177" fill="#e7f0ff" font-size="11.5" font-weight="600">6/20</text><text x="174" y="211" fill="#9fb4d4" font-size="10.5" text-anchor="end">MASK-JOINT (siblings)</text><rect x="182" y="196" width="87.5" height="22" rx="3" fill="#5ad1a8"/><text x="276.5" y="211" fill="#e7f0ff" font-size="11.5" font-weight="600">7/20</text><text x="174" y="245" fill="#9fb4d4" font-size="10.5" text-anchor="end">MASK-ITERATIVE top-1</text><rect x="182" y="230" width="62.5" height="22" rx="3" fill="#8fc6ff"/><text x="251.5" y="245" fill="#e7f0ff" font-size="11.5" font-weight="600">5/20</text><text x="174" y="279" fill="#9fb4d4" font-size="10.5" text-anchor="end">ORACLE (truth seed)</text><rect x="182" y="264" width="137.5" height="22" rx="3" fill="#e0a458"/><text x="326.5" y="279" fill="#e7f0ff" font-size="11.5" font-weight="600">11/20</text><text x="40" y="320" fill="#9fb4d4" font-size="10.5" font-weight="400">Net +1 re-find (gained 1, lost 0); 12/20 have siblings.</text><text x="40" y="336" fill="#9fb4d4" font-size="10.5" font-weight="400">MASK-JOINT CI 18-57% vs ORACLE 11/20 (blind 6/20).</text><text x="40" y="354" fill="#e0a458" font-size="10.5" font-weight="600">MODEST-SIBLING-LIFT: neighbour-lock is part of the wall, not all.</text>
  <rect x="492" y="66" width="444" height="300" rx="10" fill="#111a2e" stroke="#22304d"/><text x="508" y="92" fill="#e7f0ff" font-size="14.5" font-weight="700">P74 | Coherent centroid veto?</text><text x="508" y="109" fill="#9fb4d4" font-size="10.5">Borrowed: offset in EVERY sector; reject only if directions agree</text><text x="702" y="136" fill="#9fb4d4" font-size="10.5" font-weight="700">power</text><text x="812" y="136" fill="#9fb4d4" font-size="10.5" font-weight="700">false-kill</text><text x="892" y="136" fill="#9fb4d4" font-size="10.5" font-weight="700">AUC</text><text x="508" y="166" fill="#8fc6ff" font-size="11.5" font-weight="700">SINGLE sector (P57)</text><text x="702" y="166" fill="#e7f0ff" font-size="13" font-weight="600">50%</text><text x="812" y="166" fill="#d9776f" font-size="13" font-weight="600">9/16</text><text x="892" y="166" fill="#e7f0ff" font-size="13" font-weight="600">0.47</text><text x="508" y="206" fill="#5ad1a8" font-size="11.5" font-weight="700">MULTI sector (coherent)</text><text x="702" y="206" fill="#e7f0ff" font-size="13" font-weight="600">0%</text><text x="812" y="206" fill="#5ad1a8" font-size="13" font-weight="600">0/16</text><text x="892" y="206" fill="#e7f0ff" font-size="13" font-weight="600">0.49</text><line x1="508" y1="180" x2="920" y2="180" stroke="#3b4a63" stroke-dasharray="3 2"/><text x="508" y="254" fill="#9fb4d4" font-size="10.5" font-weight="400">Coherence cleared 9 of 9 single-sector false-kills of known planets,</text><text x="508" y="270" fill="#9fb4d4" font-size="10.5" font-weight="400">false-kill 56% -> 0%, but blend power fell to 0% (AUC 0.49 = chance).</text><text x="508" y="294" fill="#d9776f" font-size="10.5" font-weight="600">COHERENCE-SAVES-PLANETS-BUT-NO-POWER: safe to KEEP, not to gate.</text>
  <rect x="24" y="392" width="912" height="150" rx="10" fill="#111a2e" stroke="#22304d"/><text x="40" y="418" fill="#e7f0ff" font-size="14.5" font-weight="700">Round takeaway: both borrowed levers measured, neither gates</text><text x="42" y="448" fill="#8fc6ff" font-size="12.5" font-weight="700">P73</text><text x="84" y="448" fill="#9fb4d4" font-size="11.5">sibling masking: +1 re-find of 20, wall stays mostly intrinsic (alias/noise)</text><text x="42" y="474" fill="#5ad1a8" font-size="12.5" font-weight="700">P74</text><text x="84" y="474" fill="#9fb4d4" font-size="11.5">cross-sector coherence: kills 0 known planets, but catches 0 blends either</text><text x="84" y="500" fill="#9fb4d4" font-size="11.5">safeToGate = false on both; nothing wired into the critic or the money path</text><text x="40" y="532" fill="#e7f0ff" font-size="10.5" font-weight="600">Positive controls on real TESS-SPOC photometry; discoveryClaim = false everywhere; reports/ + RESEARCH.md carry every number.</text>
</svg>
