<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 604" role="img" font-family="ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="604" fill="#0b1220"/>
  <text x="24" y="30" fill="#e7f0ff" font-size="18" font-weight="700">Four levers borrowed from a real TESS survey - measured on our chain, none clears a gate</text>
  <text x="24" y="48" fill="#9fb4d4" font-size="11">Every number re-derived from a committed P73-P76 report; positive controls on known planets and a model-free null; discoveryClaim = false.</text>
  <rect x="24" y="64" width="450" height="232" rx="10" fill="#111a2e" stroke="#22304d"/><text x="40" y="90" fill="#8fc6ff" font-size="13" font-weight="700">P73</text><text x="84" y="90" fill="#e7f0ff" font-size="13.5" font-weight="700">Mask siblings, re-search</text><text x="40" y="108" fill="#9fb4d4" font-size="10.5">eumemic --mask-tois, on the P62 20-planet sample</text><text x="144" y="172" fill="#5ad1a8" font-size="26" font-weight="700" text-anchor="middle">6-&gt;7</text><text x="144" y="187" fill="#9fb4d4" font-size="10" text-anchor="middle">blind vs masked re-find /20</text><text x="354" y="172" fill="#e0a458" font-size="26" font-weight="700" text-anchor="middle">11</text><text x="354" y="187" fill="#9fb4d4" font-size="10" text-anchor="middle">ORACLE ceiling /20</text><text x="40" y="214" fill="#9fb4d4" font-size="10.5" font-weight="400">Net +1 (gained 1, lost 0) -- an assisted ceiling.</text><text x="40" y="234" fill="#9fb4d4" font-size="10.5" font-weight="400">Neighbour-lock is part of the seed wall, not all of it.</text><text x="40" y="282" fill="#e0a458" font-size="10.5" font-weight="600">MODEST-SIBLING-LIFT - the wall stays mostly intrinsic.</text>
  <rect x="486" y="64" width="450" height="232" rx="10" fill="#111a2e" stroke="#22304d"/><text x="502" y="90" fill="#5ad1a8" font-size="13" font-weight="700">P74</text><text x="546" y="90" fill="#e7f0ff" font-size="13.5" font-weight="700">Coherent centroid veto</text><text x="502" y="108" fill="#9fb4d4" font-size="10.5">offset direction must agree across every sector</text><text x="606" y="172" fill="#5ad1a8" font-size="26" font-weight="700" text-anchor="middle">9-&gt;0</text><text x="606" y="187" fill="#9fb4d4" font-size="10" text-anchor="middle">known-planet false-kills /16</text><text x="816" y="172" fill="#d9776f" font-size="26" font-weight="700" text-anchor="middle">50%-&gt;0%</text><text x="816" y="187" fill="#9fb4d4" font-size="10" text-anchor="middle">blend-catch power</text><text x="502" y="214" fill="#9fb4d4" font-size="10.5" font-weight="400">Coherence cleared 9 false-kills but AUC 0.49 = chance.</text><text x="502" y="234" fill="#9fb4d4" font-size="10.5" font-weight="400">It saves planets and catches nothing new -- a diagnostic.</text><text x="502" y="282" fill="#d9776f" font-size="10.5" font-weight="600">COHERENCE-SAVES-PLANETS-BUT-NO-POWER - not a gate.</text>
  <rect x="24" y="316" width="450" height="232" rx="10" fill="#111a2e" stroke="#22304d"/><text x="40" y="342" fill="#e0a458" font-size="13" font-weight="700">P75</text><text x="84" y="342" fill="#e7f0ff" font-size="13.5" font-weight="700">Inverted-curve FP null</text><text x="40" y="360" fill="#9fb4d4" font-size="10.5">invert + mask all planets; a leftover dip is pure noise</text><text x="144" y="424" fill="#d9776f" font-size="26" font-weight="700" text-anchor="middle">12/16</text><text x="144" y="439" fill="#9fb4d4" font-size="10" text-anchor="middle">AR(1) gate calls significant (75%)</text><text x="354" y="424" fill="#8fc6ff" font-size="26" font-weight="700" text-anchor="middle">5/16</text><text x="354" y="439" fill="#9fb4d4" font-size="10" text-anchor="middle">model-free flags</text><text x="40" y="466" fill="#9fb4d4" font-size="10.5" font-weight="400">Nominal is 5%; AR(1) overshoots ~15x and 7 passes are overturned.</text><text x="40" y="486" fill="#9fb4d4" font-size="10.5" font-weight="400">mean FAP delta (block-AR1) +0.164 - AR(1) runs hot.</text><text x="40" y="534" fill="#e0a458" font-size="10.5" font-weight="600">GATE-OPTIMISTIC-ON-REAL-NOISE - measured, not re-tuned.</text>
  <rect x="486" y="316" width="450" height="232" rx="10" fill="#111a2e" stroke="#22304d"/><text x="502" y="342" fill="#8fc6ff" font-size="13" font-weight="700">P76</text><text x="546" y="342" fill="#e7f0ff" font-size="13.5" font-weight="700">Multi-source novelty</text><text x="502" y="360" fill="#9fb4d4" font-size="10.5">P48's Archive tables PLUS ExoFOP TOI/CTOI (8151 rows)</text><text x="606" y="424" fill="#5ad1a8" font-size="26" font-weight="700" text-anchor="middle">5-&gt;5</text><text x="606" y="439" fill="#9fb4d4" font-size="10" text-anchor="middle">novel /5 after adding CTOIs</text><text x="816" y="424" fill="#8fc6ff" font-size="26" font-weight="700" text-anchor="middle">0</text><text x="816" y="439" fill="#9fb4d4" font-size="10" text-anchor="middle">novelty lost (shrink)</text><text x="502" y="466" fill="#9fb4d4" font-size="10.5" font-weight="400">Both query paths pass a live control before any 0-hit is trusted.</text><text x="502" y="486" fill="#9fb4d4" font-size="10.5" font-weight="400">A wider net made no candidate less novel - unannounced, not a planet.</text><text x="502" y="534" fill="#9fb4d4" font-size="10.5" font-weight="600">NO-EXTRA-SHRINK - catalogs silent, not evidence of a planet.</text>
  <text x="24" y="592" fill="#e7f0ff" font-size="10.5" font-weight="600">safeToGate = false on all four; nothing wired into the critic or the money path. SPOC TCE / literature not yet covered (P76).</text>
</svg>
