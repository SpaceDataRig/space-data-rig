<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#0b1020"/><text x="28" y="44" font-size="25" fill="#e8ecf7" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">Audit-10 hardening: now LIVE on production</text><text x="28" y="70" font-size="13" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">Deployed to spacedatarig.app (version fc6810a6). Verified against the live endpoints, not asserted.</text><rect x="28" y="96" width="600" height="300" rx="16" fill="#141b33" stroke="#26314f"/><text x="50" y="130" font-size="18" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">What took effect</text><text x="50" y="158" font-size="14" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">#7  Deny-by-default admin gate</text><text x="66" y="176" font-size="13" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">state-changing routes now 401 unless they carry the</text><text x="50" y="200" font-size="14" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial"></text><text x="66" y="218" font-size="13" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">operator bearer token; nothing is open by default.</text><text x="50" y="242" font-size="14" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">#7  Per-finding anchor lock</text><text x="66" y="260" font-size="13" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">a same-run re-entrant anchor can no longer double-spend</text><text x="50" y="284" font-size="14" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial"></text><text x="66" y="302" font-size="13" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">the fee wallet -- concurrent calls await one in-flight result.</text><text x="50" y="326" font-size="14" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">#1  scienceHash on new anchors</text><text x="66" y="344" font-size="13" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">each fresh mainnet memo appends a stable content</text><text x="50" y="368" font-size="14" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial"></text><text x="66" y="386" font-size="13" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">address beside the timestamped bundleHash commitment.</text><text x="50" y="410" font-size="14" fill="#9fb0d6" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">Backward-safe</text><text x="66" y="428" font-size="13" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">existing anchors are byte-identical; verification still</text><text x="50" y="452" font-size="14" fill="#e8ecf7" font-weight="700" font-family="ui-sans-serif,system-ui,Arial"></text><text x="66" y="470" font-size="13" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">matches the bundleHash, so the daily re-check holds.</text><rect x="648" y="96" width="524" height="300" rx="16" fill="#141b33" stroke="#26314f"/><text x="670" y="130" font-size="18" fill="#5aa9ff" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">Live check on spacedatarig.app</text><text x="670" y="168" font-size="14" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">POST /api/anchor, no token</text><text x="670" y="190" font-size="16" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">401</text><text x="670" y="228" font-size="14" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">POST /api/anchor, wrong token</text><text x="670" y="250" font-size="16" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">401</text><text x="670" y="288" font-size="14" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">POST /api/anchor, right token (no such id)</text><text x="670" y="310" font-size="16" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">404  (gate passed, no spend)</text><text x="670" y="348" font-size="14" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">GET /  and  GET /api/ledger</text><text x="670" y="370" font-size="16" fill="#37d39b" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">200</text><rect x="28" y="412" width="1144" height="268" rx="16" fill="#141b33" stroke="#26314f"/><text x="50" y="446" font-size="18" fill="#f5b544" font-weight="800" font-family="ui-sans-serif,system-ui,Arial">Unchanged, by design</text><text x="50" y="482" font-size="14" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">The autonomous hourly loop runs cron -&gt; Durable Object -&gt; Workflow directly; it never passes through the gated HTTP</text><text x="50" y="504" font-size="14" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">routes, so it kept anchoring accepted findings throughout. Read-only views, the public dashboard and the ledger are open.</text><text x="50" y="546" font-size="14" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">No production threshold moved, no verdict flipped, no historical bundleHash altered. The FPP and detection ceilings</text><text x="50" y="568" font-size="14" fill="#e8ecf7" font-weight="600" font-family="ui-sans-serif,system-ui,Arial">stand exactly as reported in P82: accepted-call precision 42.2% and centroid 0/59 blends on real TESS data.</text><text x="50" y="612" font-size="15" fill="#9fb0d6" font-weight="700" font-family="ui-sans-serif,system-ui,Arial">safeToGate false   discoveryClaim false</text><text x="50" y="646" font-size="13" fill="#9fb0d6" font-weight="400" font-family="ui-sans-serif,system-ui,Arial">To use the dashboard's manual run / anchor buttons, an operator stores the same bearer token in the browser once.</text></svg>
