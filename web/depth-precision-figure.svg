<rect x="70" y="340" width="870" height="150" rx="10" fill="#131a2e" stroke="#243049"/>
<text x="88" y="366" fill="#e6edf7" font-size="14">A "+/-" is read as ONE standard deviation, which covers about two thirds.</text>
<text x="88" y="386" fill="#94a3b8" font-size="12">A median covers exactly half the rows, so printing it as the bar under-states the error by design.</text>
<text x="88" y="416" fill="#f87171" font-size="13">printed before:   660 ppm (0.0660%)   -- a claim of about one part in a thousand</text>
<text x="88" y="438" fill="#4ade80" font-size="13">printed now:      660 +/- 400 ppm (0.07 +/- 0.04 %)   -- rendered by src/core/depthFormat.ts itself</text>
<text x="88" y="464" fill="#94a3b8" font-size="12">the bar is 50% of the depth, in quadrature with each record's own statistical term 1/|snr|;</text>
<text x="88" y="480" fill="#94a3b8" font-size="12">the value keeps its own digits, because the anchored bundle commits depthFrac exactly.</text>
<text x="70" y="526" fill="#fbbf24" font-size="13">Worst row: 188.9% -- further off than the depth is deep. 95/68 = 2.18 against 1.96 for a Gaussian,</text>
<text x="70" y="544" fill="#fbbf24" font-size="13">so the one-sigma bar is what is defensible here and no surface doubles it into a 95% interval.</text>
<text x="70" y="572" fill="#94a3b8" font-size="12">Same rule applied to the period: a BLS grid node is quoted with the digits the grid resolved, not three decimals.</text>
<text x="70" y="644" fill="#94a3b8" font-size="12">Source: reports/p90-depth-estimators.json | generator: scripts/depth-precision-figure.ts | nothing gated, anchored or claimed.</text>
