<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" font-family="Segoe UI, Roboto, sans-serif"><rect x="0" y="0" width="980" height="660" fill="#0b1020"/><text x="24" y="34" fill="#7dd3fc" font-size="19" font-weight="700">A published depth and a published SNR must describe the same transit</text><text x="24" y="58" fill="#94a3b8" font-size="12.5">Source: https://spacedatarig.app/api/findings sampled 2026-10-18T07:05:24Z (94 findings). Checkable = the row also publishes noiseSigmaFrac and a positive depth and SNR.</text><text x="24" y="78" fill="#fbbf24" font-size="12.5">snr is not an independent measurement: it is depth/sigma*sqrt(nIn). Re-pricing a refined depth is required, or the row refutes itself.</text><text x="24" y="98" fill="#94a3b8" font-size="12">Rows written before the guard published no scatter, so they cannot be checked here; they are disclosed as a count, not hidden.</text><rect x="84" y="88" width="896" height="426" rx="10" fill="#131a2e" stroke="#243049"/><text x="96" y="114" fill="#7dd3fc" font-size="16" font-weight="700">Every checkable record: published depth (x) against the depth its own SNR implies (y)</text><text x="96" y="130" fill="#94a3b8" font-size="12">implied = snr * noiseSigmaFrac / sqrt(nPointsInTransit), all three taken from the same row. On the line means the two headline numbers agree.</text><line x1="-88.66324839001479" y1="132" x2="-88.66324839001479" y2="462" stroke="#243049" stroke-opacity="0.6"/><line x1="96" y1="535.4203276731384" x2="926" y2="535.4203276731384" stroke="#243049" stroke-opacity="0.6"/><text x="-88.66324839001479" y="478" fill="#94a3b8" font-size="10.5" text-anchor="middle">20</text><text x="80" y="539.4203276731384" fill="#94a3b8" font-size="10.5" text-anchor="end">20</text><line x1="-88.66324839001479" y1="132" x2="-88.66324839001479" y2="462" stroke="#243049" stroke-opacity="0.6"/><line x1="96" y1="535.4203276731384" x2="926" y2="535.4203276731384" stroke="#243049" stroke-op