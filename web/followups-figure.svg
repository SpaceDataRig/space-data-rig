<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" font-family="ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="800" fill="#0b1220"/>
  <text x="24" y="30" fill="#e7f0ff" font-size="18" font-weight="700">Measure before you gate, round 2: five targeted follow-ups on real TESS photometry</text>
  <text x="24" y="48" fill="#9fb4d4" font-size="11">Every number re-derived from a committed P67-P71 report; positive controls on known planets; nothing gated, anchored or claimed (discoveryClaim = false).</text>
  <rect x="24" y="64" width="444" height="222" rx="10" fill="#111a2e" stroke="#22304d"/><text x="40" y="90" fill="#e7f0ff" font-size="14.5" font-weight="700">P67 | Is the seed wall real?</text><text x="40" y="107" fill="#9fb4d4" font-size="10.5">Does the iterative detector seed better than one BLS peak?</text><text x="166" y="138" fill="#9fb4d4" font-size="10.5" text-anchor="end">naive BLS peak</text><rect x="174" y="124" width="56.7" height="20" rx="3" fill="#8fc6ff"/><text x="237.7" y="138" fill="#e7f0ff" font-size="11.5" font-weight="600">4/20</text><text x="166" y="167" fill="#9fb4d4" font-size="10.5" text-anchor="end">iterative top-1</text><rect x="174" y="153" width="70.8" height="20" rx="3" fill="#8fc6ff"/><text x="251.8" y="167" fill="#e7f0ff" font-size="11.5" font-weight="600">5/20</text><text x="166" y="196" fill="#9fb4d4" font-size="10.5" text-anchor="end">iterative top-3</text><rect x="174" y="182" width="70.8" height="20" rx="3" fill="#5ad1a8"/><text x="251.8" y="196" fill="#e7f0ff" font-size="11.5" font-weight="600">5/20</text><text x="166" y="225" fill="#9fb4d4" font-size="10.5" text-anchor="end">oracle (truth)</text><rect x="174" y="211" width="141.7" height="20" rx="3" fill="#e0a458"/><text x="322.7" y="225" fill="#e7f0ff" font-size="11.5" font-weight="600">10/20</text><text x="40" y="246" fill="#9fb4d4" font-size="10.5" font-weight="400">Iterative multi-signal seeding lifts recall by only +5 pp (Wilson CIs overlap).</text><text x="40" y="264" fill="#e0a458" font-size="10.5" font-weight="600">MODEST-SEED-LIFT - the P62 seed wall holds; a blind correct seed is key.</text>
  <rect x="492" y="64" width="444" height="222" rx="10" fill="#111a2e" stroke="#22304d"/><text x="508" y="90" fill="#e7f0ff" font-size="14.5" font-weight="700">P68 | Can any tool self-validate?</text><text x="508" y="107" fill="#9fb4d4" font-size="10.5">Full threshold sweep: AUC of each discriminator (blend vs planet).</text><line x1="717.0" y1="116" x2="717.0" y2="226.0" stroke="#3b4a63" stroke-dasharray="3 2"/><text x="634" y="133" fill="#9fb4d4" font-size="10.5" text-anchor="end">shape coherence</text><rect x="642" y="122" width="104.0" height="16" rx="2" fill="#5ad1a8"/><text x="752.0" y="133" fill="#e7f0ff" font-size="10.5" font-weight="600">0.69</text><text x="634" y="155" fill="#9fb4d4" font-size="10.5" text-anchor="end">PSF offset</text><rect x="642" y="144" width="100.0" height="16" rx="2" fill="#8fc6ff"/><text x="748.0" y="155" fill="#e7f0ff" font-size="10.5" font-weight="600">0.67</text><text x="634" y="177" fill="#9fb4d4" font-size="10.5" text-anchor="end">odd/even depth</text><rect x="642" y="166" width="97.9" height="16" rx="2" fill="#8fc6ff"/><text x="745.9" y="177" fill="#e7f0ff" font-size="10.5" font-weight="600">0.65</text><text x="634" y="199" fill="#9fb4d4" font-size="10.5" text-anchor="end">secondary ecl.</text><rect x="642" y="188" width="93.4" height="16" rx="2" fill="#8fc6ff"/><text x="741.4" y="199" fill="#e7f0ff" font-size="10.5" font-weight="600">0.62</text><text x="634" y="221" fill="#9fb4d4" font-size="10.5" text-anchor="end">Gaia dilution</text><rect x="642" y="210" width="71.2" height="16" rx="2" fill="#d9776f"/><text x="719.2" y="221" fill="#e7f0ff" font-size="10.5" font-weight="600">0.47</text><text x="717.0" y="230" fill="#9fb4d4" font-size="9.5" text-anchor="middle">0.5 = chance</text><text x="508" y="246" fill="#9fb4d4" font-size="10.5" font-weight="400">Best AUC 0.69 (shape-coherence); Gaia dilution is below chance (0.47).</text><text x="508" y="264" fill="#d9776f" font-size="10.5" font-weight="600">NO-GATE at any threshold - a single-digit % blend catch at zero false-kill.</text>
  <rect x="24" y="306" width="444" height="222" rx="10" fill="#111a2e" stroke="#22304d"/><text x="40" y="332" fill="#e7f0ff" font-size="14.5" font-weight="700">P69 | Is our significance honest?</text><text x="40" y="349" fill="#9fb4d4" font-size="10.5">AR(1)-model null vs a model-free block bootstrap on real noise bumps.</text><text x="134" y="414" fill="#d9776f" font-size="32" font-weight="700" text-anchor="middle">5/8</text><text x="134" y="430" fill="#9fb4d4" font-size="10.5" text-anchor="middle">noise bumps only AR(1) clears</text><text x="324" y="414" fill="#e0a458" font-size="32" font-weight="700" text-anchor="middle">+0.27</text><text x="324" y="430" fill="#9fb4d4" font-size="10.5" text-anchor="middle">mean FAP delta (AR1 - bootstrap)</text><text x="40" y="454" fill="#9fb4d4" font-size="10.5" font-weight="400">The synthetic AR(1) ensemble understates the real residual tails, so the</text><text x="40" y="470" fill="#9fb4d4" font-size="10.5" font-weight="400">FAP gate is slightly OPTIMISTIC. Not an active-star effect (excess@lag</text><text x="40" y="486" fill="#9fb4d4" font-size="10.5" font-weight="400">-0.01). Caveat: multi-planet masks leave sibling signal (max SNR 1172).</text><text x="40" y="520" fill="#e7f0ff" font-size="10.5" font-weight="600">Measured only - the production gate is unchanged.</text>
  <rect x="492" y="306" width="444" height="222" rx="10" fill="#111a2e" stroke="#22304d"/><text x="508" y="332" fill="#e7f0ff" font-size="14.5" font-weight="700">P70 | Does the LLM decide anything?</text><text x="508" y="349" fill="#9fb4d4" font-size="10.5">Structural ablation + the model's informational quality.</text><text x="602" y="414" fill="#5ad1a8" font-size="32" font-weight="700" text-anchor="middle">0</text><text x="602" y="430" fill="#9fb4d4" font-size="10.5" text-anchor="middle">decisions the LLM changed</text><text x="792" y="414" fill="#d9776f" font-size="32" font-weight="700" text-anchor="middle">3/3</text><text x="792" y="430" fill="#9fb4d4" font-size="10.5" text-anchor="middle">labelled blends it called PLANET</text><text x="508" y="456" fill="#9fb4d4" font-size="10.5" font-weight="400">Verified by recompute: the gate/verdict path never reads the model, so</text><text x="508" y="472" fill="#9fb4d4" font-size="10.5" font-weight="400">removing it provably changes ZERO decisions. On information it UNDER-</text><text x="508" y="488" fill="#9fb4d4" font-size="10.5" font-weight="400">flags blends - worse than the deterministic tests, which caught only 1/3.</text><text x="508" y="520" fill="#e0a458" font-size="10.5" font-weight="600">Hypothesis broker, not arbiter - it stays advisory. Money path untouched.</text>
  <rect x="24" y="548" width="444" height="222" rx="10" fill="#111a2e" stroke="#22304d"/><text x="40" y="574" fill="#e7f0ff" font-size="14.5" font-weight="700">P71 | Is 'accepted' even reachable?</text><text x="40" y="591" fill="#9fb4d4" font-size="10.5">Same known planets, run BLIND (catalog = []) vs CORROBORATED.</text><text x="134" y="656" fill="#d9776f" font-size="32" font-weight="700" text-anchor="middle">0/14</text><text x="134" y="672" fill="#9fb4d4" font-size="10.5" text-anchor="middle">accepted BLIND (all need-more-data)</text><text x="324" y="656" fill="#5ad1a8" font-size="32" font-weight="700" text-anchor="middle">8/14</text><text x="324" y="672" fill="#9fb4d4" font-size="10.5" text-anchor="middle">accepted when corroborated</text><text x="40" y="698" fill="#9fb4d4" font-size="10.5" font-weight="400">Detect -> critic is the SAME machinery; the only difference is whether</text><text x="40" y="714" fill="#9fb4d4" font-size="10.5" font-weight="400">the host is corroborated (pi Men c is one that flips). So P65's "0/2 pass"</text><text x="40" y="730" fill="#9fb4d4" font-size="10.5" font-weight="400">is the CORRECT blind-by-design result - a novel claim has no match.</text><text x="40" y="762" fill="#5ad1a8" font-size="10.5" font-weight="600">ACCEPT-PATH-REACHABLE - fires the instant the catalog corroborates.</text>
  <rect x="492" y="548" width="444" height="222" rx="10" fill="#111a2e" stroke="#22304d"/><text x="508" y="574" fill="#e7f0ff" font-size="14.5" font-weight="700">This round | what changed</text><text x="508" y="591" fill="#9fb4d4" font-size="10.5">Five targeted critiques, measured on real TESS photometry.</text><text x="510" y="620" fill="#8fc6ff" font-size="12" font-weight="700">P67</text><text x="548" y="620" fill="#9fb4d4" font-size="11">the seed wall holds</text><text x="510" y="640" fill="#d9776f" font-size="12" font-weight="700">P68</text><text x="548" y="640" fill="#9fb4d4" font-size="11">no tool can gate</text><text x="510" y="660" fill="#e0a458" font-size="12" font-weight="700">P69</text><text x="548" y="660" fill="#9fb4d4" font-size="11">FAP slightly optimistic</text><text x="510" y="680" fill="#5ad1a8" font-size="12" font-weight="700">P70</text><text x="548" y="680" fill="#9fb4d4" font-size="11">the LLM decides nothing</text><text x="510" y="700" fill="#5ad1a8" font-size="12" font-weight="700">P71</text><text x="548" y="700" fill="#9fb4d4" font-size="11">the accept path is real</text><text x="508" y="730" fill="#9fb4d4" font-size="10.5" font-weight="400">Every conclusion is a NEGATIVE or a calibration note: joint search is still</text><text x="508" y="746" fill="#9fb4d4" font-size="10.5" font-weight="400">not free, no pixel/curve tool self-validates, the model stays advisory.</text><text x="508" y="762" fill="#e7f0ff" font-size="10.5" font-weight="600">Nothing gated, anchored or staked - discoveryClaim = false everywhere.</text>
</svg>
