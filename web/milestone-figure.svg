<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" font-family="ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="#0b1220"/>
  <text x="24" y="30" fill="#e7f0ff" font-size="18" font-weight="700">Measure before you gate: four targeted follow-ups on real TESS photometry</text>
  <text x="24" y="48" fill="#9fb4d4" font-size="11">Every number re-derived from a committed report; positive controls on known planets; nothing gated, anchored or claimed (discoveryClaim = false).</text>
  <rect x="24" y="64" width="444" height="236" rx="10" fill="#111a2e" stroke="#22304d"/><text x="40" y="90" fill="#e7f0ff" font-size="15" font-weight="700">P62 | Phase-aligned joint fold</text><text x="40" y="108" fill="#9fb4d4" font-size="11">Re-find of 20 known planets - does a smarter fold help?</text><text x="166" y="147" fill="#9fb4d4" font-size="11" text-anchor="end">SINGLE</text><rect x="174" y="130" width="125.0" height="26" rx="3" fill="#8fc6ff"/><text x="307.0" y="147" fill="#e7f0ff" font-size="12" font-weight="600">6/20</text><text x="166" y="185" fill="#9fb4d4" font-size="11" text-anchor="end">NAIVE-JOINT</text><rect x="174" y="168" width="125.0" height="26" rx="3" fill="#8fc6ff"/><text x="307.0" y="185" fill="#e7f0ff" font-size="12" font-weight="600">6/20</text><text x="166" y="223" fill="#9fb4d4" font-size="11" text-anchor="end">REFINED (data seed)</text><rect x="174" y="206" width="83.3" height="26" rx="3" fill="#d9776f"/><text x="265.3" y="223" fill="#e7f0ff" font-size="12" font-weight="600">4/20</text><text x="166" y="261" fill="#9fb4d4" font-size="11" text-anchor="end">ORACLE (truth seed)</text><rect x="174" y="244" width="208.3" height="26" rx="3" fill="#5ad1a8"/><text x="390.3" y="261" fill="#e7f0ff" font-size="12" font-weight="600">10/20</text><text x="40" y="286" fill="#e0a458" font-size="11" font-weight="600">NO-LIFT - the fold doubles (4->10) only with a truth seed;</text><text x="40" y="299" fill="#e0a458" font-size="11" font-weight="600">a blind seed is usually the wrong period -> bottleneck = seed acquisition.</text>
  <rect x="492" y="64" width="444" height="236" rx="10" fill="#111a2e" stroke="#22304d"/><text x="508" y="90" fill="#e7f0ff" font-size="15" font-weight="700">P63 | Soft blend-likelihood</text><text x="508" y="108" fill="#9fb4d4" font-size="11">Continuous score (0-1), advisory weight - NOT a veto.</text><text x="612" y="174" fill="#d9776f" font-size="34" font-weight="700" text-anchor="middle">8/16</text><text x="612" y="194" fill="#9fb4d4" font-size="11" text-anchor="middle">50% false-kill rate</text><text x="812" y="174" fill="#5ad1a8" font-size="34" font-weight="700" text-anchor="middle">9/12</text><text x="812" y="194" fill="#9fb4d4" font-size="11" text-anchor="middle">75% blends caught</text><text x="508" y="232" fill="#9fb4d4" font-size="11">Operating point: flag when blend-likelihood >= 50.</text><text x="508" y="250" fill="#9fb4d4" font-size="11">A non-zero false-kill is exactly why this is a score, not a gate;</text><text x="508" y="268" fill="#9fb4d4" font-size="11">it weights the critic (additive, default-off) - money path unchanged.</text>
  <rect x="24" y="320" width="444" height="236" rx="10" fill="#111a2e" stroke="#22304d"/><text x="40" y="346" fill="#e7f0ff" font-size="15" font-weight="700">P64 | Multi-sector fetch telemetry</text><text x="40" y="364" fill="#9fb4d4" font-size="11">Same bytes, repeat sweep - is re-fetch the bottleneck?</text><text x="144" y="430" fill="#8fc6ff" font-size="34" font-weight="700" text-anchor="middle">29%</text><text x="144" y="450" fill="#9fb4d4" font-size="11" text-anchor="middle">cold cache (7/24)</text><text x="344" y="430" fill="#5ad1a8" font-size="34" font-weight="700" text-anchor="middle">100%</text><text x="344" y="450" fill="#9fb4d4" font-size="11" text-anchor="middle">warm cache (24/24)</text><text x="40" y="488" fill="#9fb4d4" font-size="11">Wall time 7714ms cold -> 77ms warm - download is</text><text x="40" y="506" fill="#9fb4d4" font-size="11">the bottleneck; a per-key cache makes multi-study re-fetch free.</text><text x="40" y="524" fill="#e0a458" font-size="11" font-weight="600">WARM-CACHE-FREE - research-first, no production change yet.</text>
  <rect x="492" y="320" width="444" height="236" rx="10" fill="#111a2e" stroke="#22304d"/><text x="508" y="346" fill="#e7f0ff" font-size="15" font-weight="700">P65 | External-candidate audit</text><text x="508" y="364" fill="#9fb4d4" font-size="11">Third-party claim -> full critic + gates, research mode.</text><text x="612" y="430" fill="#d9776f" font-size="34" font-weight="700" text-anchor="middle">0/2</text><text x="612" y="450" fill="#9fb4d4" font-size="11" text-anchor="middle">pass current gate</text><text x="716" y="402" fill="#9fb4d4" font-size="11">- Aakanksha: rejected (FAP 1.00, blend 0.02)</text><text x="716" y="420" fill="#9fb4d4" font-size="11">- Orbit: rejected (FAP 0.11, blend 0.00)</text><text x="508" y="488" fill="#9fb4d4" font-size="11">The critic runs blind (catalog = []), so an outside signal caps at</text><text x="508" y="506" fill="#9fb4d4" font-size="11">needs-more-data / rejected - never auto-claimed or staked.</text><text x="508" y="524" fill="#e0a458" font-size="11" font-weight="600">discoveryClaim false, anchored false - no on-chain money path.</text>
</svg>
