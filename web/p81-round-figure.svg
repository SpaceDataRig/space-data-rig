<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Roboto, sans-serif"><rect x="0" y="0" width="960" height="560" fill="#0b1020"/><text x="24" y="32" fill="#7dd3fc" font-size="19" font-weight="700">Audit-9 on the public dashboard + a TRICERATOPS-grade check (P81)</text><text x="24" y="54" fill="#94a3b8" font-size="12.5">Live at spacedatarig.app (research.json section audit9P78P81) and the CP validations graded closer to TRICERATOPS.</text><text x="24" y="72" fill="#fbbf24" font-size="12.5">Honest first-order checks with positive controls; discoveryClaim false, safeToGate false.</text><rect x="24" y="92" width="456" height="172" rx="10" fill="#131a2e" stroke="#60a5fa" stroke-opacity="0.5"/><rect x="24" y="92" width="6" height="172" rx="3" fill="#60a5fa"/><text x="42" y="120" fill="#60a5fa" font-size="15" font-weight="700" font-family="monospace">GAP 3 GRADED  P81</text><text x="42" y="142" fill="#7dd3fc" font-size="15" font-weight="700">The strict bar separates real from claimed</text><text x="42" y="166" fill="#e6edf7" font-size="12.5">Per validated candidate: Gaia 21" census -&gt; blend EB FPP,</text><text x="42" y="184" fill="#e6edf7" font-size="12.5">  harmonic-alias accounting + multi-sector centroid F-test,</text><text x="42" y="202" fill="#e6edf7" font-size="12.5">  + the P78 empirical false-coincidence base.</text><text x="42" y="220" fill="#e6edf7" font-size="12.5">Known planets (KP) meeting the strict bar: 5/9.</text><text x="42" y="238" fill="#e6edf7" font-size="12.5">Uncertain candidates (CP) meeting it: 0/5.</text><text x="42" y="256" fill="#e6edf7" font-size="12.5">Same bar, clean separation -&gt; our machinery's discriminant works.</text><rect x="496" y="92" width="456" height="172" rx="10" fill="#131a2e" stroke="#2dd4bf" stroke-opacity="0.5"/><rect x="496" y="92" width="6" height="172" rx="3" fill="#2dd4bf"/><text x="514" y="120" fill="#2dd4bf" font-size="15" font-weight="700" font-family="monospace">GAP 3  VALIDATION  P80</text><text x="514" y="142" fill="#7dd3fc" font-size="15" font-weight="700">0/2 moved off zero</text><text x="514" y="166" fill="#e6edf7" font-size="12.5">Blind per-sector detection (claim ephemeris never fed),</text><text x="514" y="184" fill="#e6edf7" font-size="12.5">  corroborated across independent sectors, then matched:</text><text x="514" y="202" fill="#e6edf7" font-size="12.5">  KP controls 9/11; CP uncertain external 5/9.</text><text x="514" y="220" fill="#e6edf7" font-size="12.5">Non-circular: agreement between an external catalog claim</text><text x="514" y="238" fill="#e6edf7" font-size="12.5">  and an independent blind detection.</text><text x="514" y="256" fill="#e6edf7" font-size="12.5">First independent external validations for the project.</text><rect x="24" y="278" width="456" height="172" rx="10" fill="#131a2e" stroke="#4ade80" stroke-opacity="0.5"/><rect x="24" y="278" width="6" height="172" rx="3" fill="#4ade80"/><text x="42" y="306" fill="#4ade80" font-size="15" font-weight="700" font-family="monospace">GAPS 1+2  P78/P79</text><text x="42" y="328" fill="#7dd3fc" font-size="15" font-weight="700">Benchmark + real blind test</text><text x="42" y="352" fill="#e6edf7" font-size="12.5">TCE-accept cells 74% completeness vs reject 0% -&gt;</text><text x="42" y="370" fill="#e6edf7" font-size="12.5">  we track the standard BLS/TCE limit.</text><text x="42" y="388" fill="#e6edf7" font-size="12.5">24 real hosts; 2-sector bar: recall 8/10,</text><text x="42" y="406" fill="#e6edf7" font-size="12.5">  9 false-accepts, precision 47%.</text><text x="42" y="424" fill="#e6edf7" font-size="12.5">Period-only corroboration is necessary, NOT sufficient.</text><rect x="496" y="278" width="456" height="172" rx="10" fill="#131a2e" stroke="#fbbf24" stroke-opacity="0.5"/><rect x="496" y="278" width="6" height="172" rx="3" fill="#fbbf24"/><text x="514" y="306" fill="#fbbf24" font-size="15" font-weight="700" font-family="monospace">SHIPPED</text><text x="514" y="328" fill="#7dd3fc" font-size="15" font-weight="700">Panel + deploy</text><text x="514" y="352" fill="#e6edf7" font-size="12.5">p38 distills P78-P81 into research.json section</text><text x="514" y="370" fill="#e6edf7" font-size="12.5">  audit9P78P81 (all re-derived, no hardcoded numbers).</text><text x="514" y="388" fill="#e6edf7" font-size="12.5">web/app.js renders an Audit-9 card; advisory only.</text><text x="514" y="406" fill="#e6edf7" font-size="12.5">Deployed to spacedatarig.app after an idle-window poll;</text><text x="514" y="424" fill="#e6edf7" font-size="12.5">  live research.json + app.js + /health verified 200.</text><text x="514" y="442" fill="#e6edf7" font-size="12.5">CI passing, 452 offline tests.</text><text x="24" y="546" fill="#94a3b8" font-size="12">SpaceDataRig/space-data-rig - spacedatarig.app - reproduce: npm run p78:blind-multisector / p79:benchmark / p80:external-validation / p81:triceratops-lite.</text></svg>
