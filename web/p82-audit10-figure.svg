<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#0b1020"/><text x="24" y="40" font-size="24" fill="#e8ecf7" font-weight="800" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">P82 scaled validation + audit-10 fixes</text><text x="24" y="66" font-size="13" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Every number measured on real public TESS-SPOC / Gaia / ExoFOP data. Research only -- not discoveries, not gated.</text><rect x="24" y="88" width="560" height="210" rx="14" fill="#141b33" stroke="#26314f"/><text x="42" y="118" font-size="17" fill="#5aa9ff" font-weight="700" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">1. SCALE -- ~20 targets -&gt; hundreds</text><text x="42" y="130" font-size="14" fill="#9fb0d6" font-weight="600" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Blind inject-recover</text><text x="42" y="152" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">425 real curves (181 injected / 244 null)</text><text x="42" y="182" font-size="14" fill="#9fb0d6" font-weight="600" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">External independent validation</text><text x="42" y="204" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">KP controls 234 + CP candidates 179 claims</text><text x="42" y="234" font-size="14" fill="#9fb0d6" font-weight="600" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Centroid per-contaminant F-test</text><text x="42" y="256" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">500 targets localised sector by sector</text><text x="42" y="284" font-size="12" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">one resumable, concurrent, byte-cached engine (out/scaled checkpoints)</text><rect x="616" y="88" width="560" height="210" rx="14" fill="#141b33" stroke="#26314f"/><text x="634" y="118" font-size="17" fill="#5aa9ff" font-weight="700" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">2. BLIND detection -- the wall holds</text><text x="634" y="140" font-size="15" fill="#9fb0d6" font-weight="600" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Recall</text><text x="760" y="140" font-size="22" fill="#37d39b" font-weight="800" text-anchor="end" font-family="ui-sans-serif,system-ui,Arial">86.2%</text><text x="634" y="176" font-size="15" fill="#9fb0d6" font-weight="600" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Accepted precision (&gt;=2-sector)</text><text x="760" y="176" font-size="22" fill="#f5b544" font-weight="800" text-anchor="end" font-family="ui-sans-serif,system-ui,Arial">42.2%</text><text x="634" y="212" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">accepted  329   true  139   false accepts  190</text><text x="634" y="246" font-size="13" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Coherent systematics -- not random noise -- set the floor:</text><text x="634" y="266" font-size="13" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">more sample narrows the bars, it does not clear the wall.</text><rect x="24" y="318" width="560" height="210" rx="14" fill="#141b33" stroke="#26314f"/><text x="42" y="348" font-size="17" fill="#5aa9ff" font-weight="700" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">3. EXTERNAL candidates -- independent, blind</text><text x="42" y="372" font-size="14" fill="#9fb0d6" font-weight="600" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">KP (known planets, positive control)</text><text x="42" y="394" font-size="15" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">validated 186/234  (CI 73.9-84.2%)</text><text x="42" y="428" font-size="14" fill="#9fb0d6" font-weight="600" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">CP (still-uncertain candidates)</text><text x="42" y="450" font-size="15" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">validated 103/179  (CI 50.2-64.5%)</text><text x="42" y="484" font-size="13" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Strict TRICERATOPS-grade (blend+alias+centroid):</text><text x="42" y="504" font-size="13" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">KP 24/234, CP 9/179 -- the gate is honest, not generous.</text><rect x="616" y="318" width="560" height="210" rx="14" fill="#141b33" stroke="#26314f"/><text x="634" y="348" font-size="17" fill="#5aa9ff" font-weight="700" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">4. CENTROID -- an honest negative + why</text><text x="634" y="372" font-size="14" fill="#9fb0d6" font-weight="600" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Known planets wrongly rejected</text><text x="634" y="394" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">2/55  (compatible with eumemic 0/565 at p&lt;0.001)</text><text x="634" y="428" font-size="14" fill="#9fb0d6" font-weight="600" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Labelled blends caught</text><text x="1158" y="428" font-size="22" fill="#ff6b6b" font-weight="800" text-anchor="end" font-family="ui-sans-serif,system-ui,Arial">0/59</text><text x="634" y="450" font-size="13" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">vs eumemic 73% -- our per-contaminant F-test has no catch power here.</text><text x="634" y="484" font-size="15" fill="#f5b544" font-weight="700" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">P84 root cause: PIXEL-BASELINE-BOUND</text><text x="634" y="504" font-size="13" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">coverage loss 70% unlocalisable; offsets match neither target</text><text x="634" y="522" font-size="13" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">nor contaminant (median bestNeighbourP 0.0611) -- fix pays off chain-wide.</text><rect x="24" y="548" width="1152" height="168" rx="14" fill="#141b33" stroke="#26314f"/><text x="42" y="578" font-size="17" fill="#5aa9ff" font-weight="700" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">audit-10 fixes shipped</text><text x="42" y="594" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">#2  P81 guardrails: Gaia-unavailable -&gt; 'undetermined' (not NaN, not in any rate); de-diluted</text><text x="42" y="616" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">     depth past 10% -&gt; flagged inconsistent, excluded from grading, reported as blend evidence.</text><text x="42" y="644" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">#5  P80 depth-stratified: headline = EASIEST subset (deep+bright); a harder 300-1000ppm tier is</text><text x="42" y="666" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">     reported alongside so the easy rate is never over-generalised.</text><text x="616" y="594" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">#6  Reusable inverted planet-free null (src/detect/invertedNull.ts); the AR(1) gate signs</text><text x="616" y="616" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">     off 75% of pure-noise bumps vs nominal 5% (model-free 31%, n=16) -- now a README headline.</text><text x="616" y="644" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">#1  Bundle: split the timestamped commitment (bundleHash) from a content address (scienceHash);</text><text x="616" y="666" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">     new anchor memos carry both, verify unchanged. discoveryClaim false, safeToGate false.</text></svg>
