<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect width="1200" height="660" fill="#0b1020"/><text x="28" y="44" font-size="25" fill="#e8ecf7" font-weight="800" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">P82 -- TESS transit rig, scaled to hundreds of real targets</text><text x="28" y="70" font-size="13" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Every figure measured on public TESS-SPOC / Gaia / ExoFOP data. First-order checks and positive controls, not discoveries.</text><rect x="28" y="92" width="372" height="250" rx="16" fill="#141b33" stroke="#26314f"/><rect x="28" y="92" width="6" height="250" rx="3" fill="#37d39b"/><text x="50" y="126" font-size="18" fill="#37d39b" font-weight="800" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">BLIND inject-recover</text><text x="50" y="140" font-size="15" fill="#9fb0d6" font-weight="600" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">425 real curves</text><text x="50" y="162" font-size="13" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">181 injected / 244 null</text><text x="50" y="210" font-size="15" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Recall</text><text x="380" y="210" font-size="30" fill="#37d39b" font-weight="800" text-anchor="end" font-family="ui-sans-serif,system-ui,Arial">86.2%</text><text x="50" y="232" font-size="12" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">95% CI 80.4% - 90.5%</text><text x="50" y="278" font-size="15" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Accepted precision (&gt;=2-sector)</text><text x="380" y="278" font-size="30" fill="#f5b544" font-weight="800" text-anchor="end" font-family="ui-sans-serif,system-ui,Arial">42.2%</text><text x="50" y="300" font-size="12" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">190 false accepts of 329 accepted</text><text x="50" y="326" font-size="12" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Coherent systematics, not noise: more N</text><text x="50" y="342" font-size="12" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">narrows bars, does not clear the wall.</text><rect x="414" y="92" width="372" height="250" rx="16" fill="#141b33" stroke="#26314f"/><rect x="414" y="92" width="6" height="250" rx="3" fill="#5aa9ff"/><text x="436" y="126" font-size="18" fill="#5aa9ff" font-weight="800" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">EXTERNAL independent</text><text x="436" y="140" font-size="13" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">detector BLIND -- claim</text><text x="436" y="158" font-size="13" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">ephemeris never fed</text><text x="436" y="205" font-size="15" fill="#9fb0d6" font-weight="600" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Confirmed planets (KP control)</text><text x="772" y="205" font-size="26" fill="#5aa9ff" font-weight="800" text-anchor="end" font-family="ui-sans-serif,system-ui,Arial">186/234</text><text x="436" y="227" font-size="12" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">reproduced blind, CI 73.9-84.2%</text><text x="436" y="272" font-size="15" fill="#9fb0d6" font-weight="600" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Uncertain candidates (CP)</text><text x="772" y="272" font-size="26" fill="#5aa9ff" font-weight="800" text-anchor="end" font-family="ui-sans-serif,system-ui,Arial">103/179</text><text x="436" y="294" font-size="12" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">reproduced blind, CI 50.2-64.5%</text><text x="436" y="326" font-size="12" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Strict blend+alias+centroid grade:</text><text x="436" y="342" font-size="13" fill="#e8ecf7" font-weight="700" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">KP 24/234, CP 9/179</text><rect x="800" y="92" width="372" height="250" rx="16" fill="#141b33" stroke="#26314f"/><rect x="800" y="92" width="6" height="250" rx="3" fill="#ff6b6b"/><text x="822" y="126" font-size="18" fill="#ff6b6b" font-weight="800" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">CENTROID F-test</text><text x="822" y="140" font-size="13" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">500 targets, sector by sector</text><text x="822" y="186" font-size="14" fill="#9fb0d6" font-weight="600" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Known planets wrongly rejected</text><text x="1150" y="186" font-size="24" fill="#37d39b" font-weight="800" text-anchor="end" font-family="ui-sans-serif,system-ui,Arial">2/55</text><text x="822" y="208" font-size="11" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">compatible with eumemic 0/565 at p&lt;0.001</text><text x="822" y="254" font-size="14" fill="#9fb0d6" font-weight="600" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Labelled blends CAUGHT</text><text x="1150" y="254" font-size="24" fill="#ff6b6b" font-weight="800" text-anchor="end" font-family="ui-sans-serif,system-ui,Arial">0/59</text><text x="822" y="276" font-size="12" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">vs eumemic 73% -- no catch power here</text><text x="822" y="306" font-size="14" fill="#f5b544" font-weight="800" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">P84 root cause: PIXEL-BASELINE-BOUND</text><text x="822" y="326" font-size="11" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">70% never localise; statistic is fine,</text><text x="822" y="342" font-size="11" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">our per-sector centroid is the limiter.</text><rect x="28" y="358" width="1144" height="278" rx="16" fill="#0e1428" stroke="#26314f"/><text x="50" y="392" font-size="18" fill="#5aa9ff" font-weight="800" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">What grew, and what did not</text><text x="50" y="426" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Sample size scales: ~20 hand-picked targets (P77/P78/P80) -&gt; hundreds per probe here, from one</text><text x="50" y="448" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">resumable, concurrent, byte-cached engine on real public data. Error bars shrink accordingly.</text><text x="50" y="486" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">The hard walls do not scale away: accepted precision stays ~42% (coherent systematics recur across</text><text x="50" y="508" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">sectors), the strict external grade stays tiny, and the centroid blend-catch is 0/59 -- so the next</text><text x="50" y="530" font-size="14" fill="#e8ecf7" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">real gains are in the pixel baseline (WCS / centroid precision / sector alignment), not a bigger N.</text><text x="50" y="574" font-size="12" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Measure-only: safeToGate false, discoveryClaim false. Full numbers: reports/p82-scaled.{md,json} and reports/p84-centroid-diagnosis.{md,json}.</text><text x="50" y="600" font-size="12" fill="#9fb0d6" font-weight="400" text-anchor="start" font-family="ui-sans-serif,system-ui,Arial">Reproduce: npm run p82:scaled -- --probe report ; npm run p84:centroid-diagnosis</text></svg>
