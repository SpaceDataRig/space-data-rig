<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" font-family="ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="410" fill="#0b1220"/>
  <text x="66" y="26" fill="#e7f0ff" font-size="16" font-weight="700">Independent transit-detection validation on real TESS photometry</text>
  <text x="66" y="42" fill="#9fb4d4" font-size="11">Three independent estimators, no shared code, on the same seeded real stars (P = 3 d; seed 7).</text>

  <text x="66" y="72" fill="#e7f0ff" font-size="13" font-weight="600">A. Completeness vs injected depth</text>
  <line x1="66" y1="322.0" x2="470" y2="322.0" stroke="#1c2740"/><text x="58" y="326.0" fill="#9fb4d4" font-size="11" text-anchor="end">0%</text><line x1="66" y1="262.5" x2="470" y2="262.5" stroke="#1c2740"/><text x="58" y="266.5" fill="#9fb4d4" font-size="11" text-anchor="end">25%</text><line x1="66" y1="203.0" x2="470" y2="203.0" stroke="#1c2740"/><text x="58" y="207.0" fill="#9fb4d4" font-size="11" text-anchor="end">50%</text><line x1="66" y1="143.5" x2="470" y2="143.5" stroke="#1c2740"/><text x="58" y="147.5" fill="#9fb4d4" font-size="11" text-anchor="end">75%</text><line x1="66" y1="84.0" x2="470" y2="84.0" stroke="#1c2740"/><text x="58" y="88.0" fill="#9fb4d4" font-size="11" text-anchor="end">100%</text>
  <line x1="66" y1="84" x2="66" y2="322" stroke="#3b4a63"/>
  <line x1="66" y1="322" x2="470" y2="322" stroke="#3b4a63"/>
  <polyline points="66.0,221.0 146.8,192.2 227.6,156.1 308.4,134.5 389.2,127.3 470.0,127.3" fill="none" stroke="#5ad1a8" stroke-width="2.2"/><circle cx="66.0" cy="221.0" r="3.1" fill="#5ad1a8"/><circle cx="146.8" cy="192.2" r="3.1" fill="#5ad1a8"/><circle cx="227.6" cy="156.1" r="3.1" fill="#5ad1a8"/><circle cx="308.4" cy="134.5" r="3.1" fill="#5ad1a8"/><circle cx="389.2" cy="127.3" r="3.1" fill="#5ad1a8"/><circle cx="470.0" cy="127.3" r="3.1" fill="#5ad1a8"/>
  <polyline points="66.0,203.0 146.8,183.2 227.6,163.3 308.4,123.7 389.2,84.0 470.0,84.0" fill="none" stroke="#8fc6ff" stroke-width="2.2"/><circle cx="66.0" cy="203.0" r="3.1" fill="#8fc6ff"/><circle cx="146.8" cy="183.2" r="3.1" fill="#8fc6ff"/><circle cx="227.6" cy="163.3" r="3.1" fill="#8fc6ff"/><circle cx="308.4" cy="123.7" r="3.1" fill="#8fc6ff"/><circle cx="389.2" cy="84.0" r="3.1" fill="#8fc6ff"/><circle cx="470.0" cy="84.0" r="3.1" fill="#8fc6ff"/>
  <polyline points="66.0,264.3 146.8,235.5 227.6,199.4 308.4,177.8 389.2,141.7 470.0,134.5" fill="none" stroke="#e0a458" stroke-width="2.2"/><circle cx="66.0" cy="264.3" r="3.1" fill="#e0a458"/><circle cx="146.8" cy="235.5" r="3.1" fill="#e0a458"/><circle cx="227.6" cy="199.4" r="3.1" fill="#e0a458"/><circle cx="308.4" cy="177.8" r="3.1" fill="#e0a458"/><circle cx="389.2" cy="141.7" r="3.1" fill="#e0a458"/><circle cx="470.0" cy="134.5" r="3.1" fill="#e0a458"/>
  <text x="66.0" y="340" fill="#9fb4d4" font-size="11" text-anchor="middle">300</text><text x="146.8" y="340" fill="#9fb4d4" font-size="11" text-anchor="middle">500</text><text x="227.6" y="340" fill="#9fb4d4" font-size="11" text-anchor="middle">1000</text><text x="308.4" y="340" fill="#9fb4d4" font-size="11" text-anchor="middle">2000</text><text x="389.2" y="340" fill="#9fb4d4" font-size="11" text-anchor="middle">4000</text><text x="470.0" y="340" fill="#9fb4d4" font-size="11" text-anchor="middle">8000</text>
  <text x="268" y="360" fill="#9fb4d4" font-size="11" text-anchor="middle">injected transit depth (ppm)</text>
  <g font-size="11">
    <line x1="74" y1="90" x2="96" y2="90" stroke="#5ad1a8" stroke-width="2.2"/><text x="102" y="94" fill="#9fb4d4">TypeScript box-fit BLS (N=33)</text>
    <line x1="74" y1="106" x2="96" y2="106" stroke="#8fc6ff" stroke-width="2.2"/><text x="102" y="110" fill="#9fb4d4">Python wotan + astropy BLS (N=12)</text>
    <line x1="74" y1="122" x2="96" y2="122" stroke="#e0a458" stroke-width="2.2"/><text x="102" y="126" fill="#9fb4d4">PDM period finder (N=33)</text>
  </g>

  <text x="560" y="72" fill="#e7f0ff" font-size="13" font-weight="600">B. Blind purity on the real curves (lower bound)</text>
  <line x1="560" y1="322.0" x2="910" y2="322.0" stroke="#1c2740"/><text x="552" y="326.0" fill="#9fb4d4" font-size="11" text-anchor="end">0</text><line x1="560" y1="250.6" x2="910" y2="250.6" stroke="#1c2740"/><text x="552" y="254.6" fill="#9fb4d4" font-size="11" text-anchor="end">10</text><line x1="560" y1="179.3" x2="910" y2="179.3" stroke="#1c2740"/><text x="552" y="183.3" fill="#9fb4d4" font-size="11" text-anchor="end">20</text>
  <line x1="560" y1="84" x2="560" y2="322" stroke="#3b4a63"/>
  <line x1="560" y1="322" x2="910" y2="322" stroke="#3b4a63"/>
  <rect x="590" y="200.7" width="42" height="121.3" fill="#d9776f"/><rect x="590" y="115.0" width="42" height="85.6" fill="#5ad1a8"/><text x="611" y="109.0" fill="#e7f0ff" font-size="11" text-anchor="middle">41.4% pure</text><text x="611" y="340" fill="#9fb4d4" font-size="12" text-anchor="middle">TypeScript</text><text x="611" y="356" fill="#9fb4d4" font-size="10" text-anchor="middle">12 TP / 17 FP</text><rect x="760" y="286.3" width="42" height="35.7" fill="#d9776f"/><rect x="760" y="236.4" width="42" height="50.0" fill="#8fc6ff"/><text x="781" y="230.4" fill="#e7f0ff" font-size="11" text-anchor="middle">58.3% pure</text><text x="781" y="340" fill="#9fb4d4" font-size="12" text-anchor="middle">Python</text><text x="781" y="356" fill="#9fb4d4" font-size="10" text-anchor="middle">7 TP / 5 FP</text>
  <text x="560" y="374" fill="#9fb4d4" font-size="10">A gated detection matching a KNOWN confirmed planet = TP; matching nothing known = FP,</text>
  <text x="560" y="388" fill="#9fb4d4" font-size="10">so a genuine-but-unconfirmed planet counts as FP: purity is a deliberate lower bound.</text>
</svg>
