<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" font-family="ui-sans-serif, system-ui, Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="380" fill="#0b1220"/>
  <text x="66" y="26" fill="#e7f0ff" font-size="16" font-weight="700">Independent transit-detection validation on real TESS photometry</text>
  <text x="66" y="44" fill="#9fb4d4" font-size="11">Three estimators sharing no code, run on the same seeded real host stars (injection-recovery at P = 3 d; seed 7).</text>

  <text x="66" y="46" fill="#e7f0ff" font-size="13" font-weight="600">A. Completeness vs injected depth</text>
  <line x1="66" y1="300.0" x2="470" y2="300.0" stroke="#1c2740"/><text x="58" y="304.0" fill="#9fb4d4" font-size="11" text-anchor="end">0%</text><line x1="66" y1="239.5" x2="470" y2="239.5" stroke="#1c2740"/><text x="58" y="243.5" fill="#9fb4d4" font-size="11" text-anchor="end">25%</text><line x1="66" y1="179.0" x2="470" y2="179.0" stroke="#1c2740"/><text x="58" y="183.0" fill="#9fb4d4" font-size="11" text-anchor="end">50%</text><line x1="66" y1="118.5" x2="470" y2="118.5" stroke="#1c2740"/><text x="58" y="122.5" fill="#9fb4d4" font-size="11" text-anchor="end">75%</text><line x1="66" y1="58.0" x2="470" y2="58.0" stroke="#1c2740"/><text x="58" y="62.0" fill="#9fb4d4" font-size="11" text-anchor="end">100%</text>
  <line x1="66" y1="58" x2="66" y2="300" stroke="#3b4a63"/>
  <line x1="66" y1="300" x2="470" y2="300" stroke="#3b4a63"/>
  <polyline points="66.0,197.3 146.8,168.0 227.6,131.3 308.4,109.3 389.2,102.0 470.0,102.0" fill="none" stroke="#5ad1a8" stroke-width="2.2"/><circle cx="66.0" cy="197.3" r="3.1" fill="#5ad1a8"/><circle cx="146.8" cy="168.0" r="3.1" fill="#5ad1a8"/><circle cx="227.6" cy="131.3" r="3.1" fill="#5ad1a8"/><circle cx="308.4" cy="109.3" r="3.1" fill="#5ad1a8"/><circle cx="389.2" cy="102.0" r="3.1" fill="#5ad1a8"/><circle cx="470.0" cy="102.0" r="3.1" fill="#5ad1a8"/>
  <polyline points="66.0,179.0 146.8,158.8 227.6,138.7 308.4,98.3 389.2,58.0 470.0,58.0" fill="none" stroke="#8fc6ff" stroke-width="2.2"/><circle cx="66.0" cy="179.0" r="3.1" fill="#8fc6ff"/><circle cx="146.8" cy="158.8" r="3.1" fill="#8fc6ff"/><circle cx="227.6" cy="138.7" r="3.1" fill="#8fc6ff"/><circle cx="308.4" cy="98.3" r="3.1" fill="#8fc6ff"/><circle cx="389.2" cy="58.0" r="3.1" fill="#8fc6ff"/><circle cx="470.0" cy="58.0" r="3.1" fill="#8fc6ff"/>
  <polyline points="66.0,241.3 146.8,212.0 227.6,175.3 308.4,153.3 389.2,116.7 470.0,109.3" fill="none" stroke="#e0a458" stroke-width="2.2"/><circle cx="66.0" cy="241.3" r="3.1" fill="#e0a458"/><circle cx="146.8" cy="212.0" r="3.1" fill="#e0a458"/><circle cx="227.6" cy="175.3" r="3.1" fill="#e0a458"/><circle cx="308.4" cy="153.3" r="3.1" fill="#e0a458"/><circle cx="389.2" cy="116.7" r="3.1" fill="#e0a458"/><circle cx="470.0" cy="109.3" r="3.1" fill="#e0a458"/>
  <text x="66.0" y="318" fill="#9fb4d4" font-size="11" text-anchor="middle">300</text><text x="146.8" y="318" fill="#9fb4d4" font-size="11" text-anchor="middle">500</text><text x="227.6" y="318" fill="#9fb4d4" font-size="11" text-anchor="middle">1000</text><text x="308.4" y="318" fill="#9fb4d4" font-size="11" text-anchor="middle">2000</text><text x="389.2" y="318" fill="#9fb4d4" font-size="11" text-anchor="middle">4000</text><text x="470.0" y="318" fill="#9fb4d4" font-size="11" text-anchor="middle">8000</text>
  <text x="268" y="338" fill="#9fb4d4" font-size="11" text-anchor="middle">injected transit depth (ppm)</text>
  <g font-size="11">
    <line x1="74" y1="64" x2="96" y2="64" stroke="#5ad1a8" stroke-width="2.2"/><text x="102" y="68" fill="#9fb4d4">TypeScript box-fit BLS (N=33)</text>
    <line x1="74" y1="80" x2="96" y2="80" stroke="#8fc6ff" stroke-width="2.2"/><text x="102" y="84" fill="#9fb4d4">Python wotan + astropy BLS (N=12)</text>
    <line x1="74" y1="96" x2="96" y2="96" stroke="#e0a458" stroke-width="2.2"/><text x="102" y="100" fill="#9fb4d4">PDM period finder (N=33)</text>
  </g>

  <text x="560" y="46" fill="#e7f0ff" font-size="13" font-weight="600">B. Blind purity on the real curves (lower bound)</text>
  <line x1="560" y1="300.0" x2="910" y2="300.0" stroke="#1c2740"/><text x="552" y="304.0" fill="#9fb4d4" font-size="11" text-anchor="end">0</text><line x1="560" y1="216.6" x2="910" y2="216.6" stroke="#1c2740"/><text x="552" y="220.6" fill="#9fb4d4" font-size="11" text-anchor="end">10</text><line x1="560" y1="133.1" x2="910" y2="133.1" stroke="#1c2740"/><text x="552" y="137.1" fill="#9fb4d4" font-size="11" text-anchor="end">20</text>
  <line x1="560" y1="58" x2="560" y2="300" stroke="#3b4a63"/>
  <line x1="560" y1="300" x2="910" y2="300" stroke="#3b4a63"/>
  <rect x="590" y="158.1" width="42" height="141.9" fill="#d9776f"/><rect x="590" y="58.0" width="42" height="100.1" fill="#5ad1a8"/><text x="611" y="52.0" fill="#e7f0ff" font-size="11" text-anchor="middle">41.4% pure</text><text x="611" y="318" fill="#9fb4d4" font-size="12" text-anchor="middle">TypeScript</text><text x="611" y="334" fill="#9fb4d4" font-size="10" text-anchor="middle">12 TP / 17 FP</text><rect x="760" y="258.3" width="42" height="41.7" fill="#d9776f"/><rect x="760" y="199.9" width="42" height="58.4" fill="#8fc6ff"/><text x="781" y="193.9" fill="#e7f0ff" font-size="11" text-anchor="middle">58.3% pure</text><text x="781" y="318" fill="#9fb4d4" font-size="12" text-anchor="middle">Python</text><text x="781" y="334" fill="#9fb4d4" font-size="10" text-anchor="middle">7 TP / 5 FP</text>
  <text x="560" y="352" fill="#9fb4d4" font-size="10">A gated detection matching a KNOWN confirmed planet = TP; matching nothing known = FP,</text>
  <text x="560" y="366" fill="#9fb4d4" font-size="10">so a genuine-but-unconfirmed planet counts as FP: purity is a deliberate lower bound.</text>
</svg>
