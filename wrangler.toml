# Space Data Rig :: Cloudflare Workers deployment descriptor.
#
# This is the edge target described in the migration blueprint: the whole rig
# (live NASA fetch -> BLS/injection-recovery -> real-time seat feed -> reproducible
# bundle -> Solana mainnet anchor) runs on Workers + Durable Objects + R2 + Workflows.
#
# Local iteration: `npx wrangler dev` (simulates DO/R2/Workflows locally). The Node
# CLI (`npm run orchestrator`) stays as the pure-pipeline regression path.
#
# Deploy: `npx wrangler deploy` (requires a Cloudflare account; secrets via
# `wrangler secret put`). Bindings below are wired in src/cf/*.

name = "space-data-rig"
main = "src/cf/worker.ts"
compatibility_date = "2025-01-01"
# node_compat gives web3 + a few libs the globals they expect (Buffer, etc.).
# Note: node:fs / node:crypto are still unavailable on Workers; the core uses Web
# Crypto + the R2/DO adapters instead (see src/cf/*).
compatibility_flags = ["nodejs_compat"]

# ---- custom domain ----------------------------------------------------------
# The zone spacedatarig.app already lives in this account; the custom-domain route
# provisions its DNS records automatically on deploy. The workers.dev subdomain
# stays enabled as a fallback hostname. Add another entry here for www if wanted.
# NOTE: keep this at the top level -- TOML would swallow it into [assets] below.
routes = [
  { pattern = "spacedatarig.app", custom_domain = true },
]
# keep the workers.dev subdomain as an operational fallback hostname once an
# explicit route exists (wrangler disables it by default in that case)
workers_dev = true
preview_urls = false

# ---- static assets (frontend) ---------------------------------------------
# With run_worker_first = false (the default), a request that matches a file under
# ./web is served straight from the asset pipeline (zero Worker CPU) -- this covers
# index.html, app.js, styles.css, space.js and the local vendor/three.js bundle.
# Only unmatched routes (/api/*, /health, the /api/events WebSocket) invoke the
# Worker, exactly like the explicit static routes in the Node server.
[assets]
directory = "./web"
binding = "ASSETS"

# ---- Durable Object: authoritative rig state + real-time fan-out -----------
[[durable_objects.bindings]]
name = "RIG_STATE"
class_name = "RigStateDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RigStateDO"]

# ---- R2: reproducible bundle artifacts (SVGs, manifest.json, HASH.txt) -----
[[r2_buckets]]
binding = "RIG_ARTIFACTS"
bucket_name = "space-data-rig-artifacts"

# ---- Workflow: durable, CPU-budgeted pipeline run --------------------------
# Each seat is its own durable step. The sim-runner's injection-recovery trials run
# as a bounded loop inside ONE step (this wrangler version has no step.map), so the
# Worker clamps confidence trials to keep a step within the CPU budget while the
# multi-target run streams progress to the DO.
[[workflows]]
binding = "RIG_RUN"
class_name = "RigRunWorkflow"
name = "rig-run"

# ---- cron trigger for autonomous research ----------------------------------
# The scheduled handler in worker.ts is a no-op unless AUTO_RESEARCH is exactly
# "1"; on-chain spending is gated separately by AUTO_ANCHOR + the daily cap.
# This deployment opts IN (see [vars] below). To pause autonomous spending without
# a redeploy of code, set AUTO_ANCHOR = "off" (or AUTO_RESEARCH = "0") and deploy.
# Cadence is every 15 minutes so the dashboard's LIVE SCIENCE OUTPUT feed has
# continuous motion; AUTO_ANCHOR_DAILY_CAP (below) still bounds SOL spend per day,
# so a faster survey cannot overspend the chain -- it only surfaces more results.
[triggers]
crons = ["*/15 * * * *"]

# ---- plain-text variables (non-secret) -------------------------------------
[vars]
CODE_VERSION = "space-data-rig@0.1.0"
# Public mainnet RPC kept in this tracked file as a safe default + fallback.
SOLANA_RPC_FALLBACKS = "https://api.mainnet-beta.solana.com"
DISCUSSION_MODE = "grounded"
# Token-free TESS-SPOC public-S3 photometry tier. ON in this deployment so every
# TIC-bearing target pulls REAL PDCSAP photometry from the anonymous S3 bucket.
MAST_S3 = "1"
# Pixel-level false-positive vetting in the critic (real photometry only). Now ON BY DEFAULT in the
# code (the critic runs it for any REAL-photometry target unless VET="0"); we keep VET="1" here so
# the intent is explicit. The reject threshold is empirically calibrated (scripts/p2-vet-calibrate.ts
# measured 14 confirmed planets all at <=0.57 arcsec; the critic rejects at >2.0 arcsec, ~3.5x margin,
# so true on-target planets pass while blends/background EBs are vetoed before anchoring -- it only
# ever REMOVES accepts). The residual cost is operational: each vetted target downloads a ~5MB
# _tp.fits, so a full sweep runs slower. Set VET="0" to opt out.
VET = "1"
# Per-sector ROBUST depth for real multi-sector SPOC targets (characterise each sector, take the
# median) instead of trusting one stitched long fold -- p12/p14 measured this beats the long fold for
# long periods (24.9% vs 34.7% median depth error). With PERSECTOR unset or "0" the scout step and
# bundle hash are byte-for-byte unchanged; the code path falls back to the single-fit depth whenever
# fewer than 2 sectors are characterisable, so it can never fabricate a number. ENABLED ("1") by
# operator decision on 2026-10-12 for real long-period targets; set back to "0" + redeploy to disable.
PERSECTOR = "1"
# Autonomous-research switches. THIS DEPLOYMENT IS OPTED IN (aggressive tier): the
# cron launches an autonomous run EVERY HOUR (AUTO_RESEARCH=1, 8 targets) and
# accepted findings are sealed on Solana mainnet (AUTO_ANCHOR=live), bounded by
# AUTO_ANCHOR_DAILY_CAP so a day can never spend more than that many ~5000-lamport
# memos (100/day ~= 0.0005 SOL/day). A code default is still inert; an operator
# flips these to "1"/"live" to enable, exactly as done here.
AUTO_RESEARCH = "1"
AUTO_RESEARCH_TARGETS = "8"
AUTO_RESEARCH_TMAG = "10"
AUTO_ANCHOR = "live"
AUTO_ANCHOR_DAILY_CAP = "100"
# Named-observation commissioning gate (mirrors AUTO_ANCHOR, for the sdr:observe:1 paid path). OPTED IN to
# "live" by operator decision on 2026-10-12: a verified 10,000 $SDR burn is anchored on Solana mainnet.
# OBSERVE_ANCHOR_DAILY_CAP is UNLIMITED by operator decision: every validly-paid observation is anchored, with
# no per-day ceiling. The real throttle is the payment itself -- each anchor still requires its own verified,
# exact 10,000 $SDR burn re-read from the chain -- so this cannot be spammed for free; each memo is a ~5000-
# lamport write paid by the rig's own SOL fee wallet, whose adequacy is the operator's to watch. Kill switches,
# both without any code change: set OBSERVE_ANCHOR = "off" to seal-but-never-anchor (spend nothing), or set
# OBSERVE_ANCHOR_DAILY_CAP back to a number (e.g. "5") or "0" to re-bound or pause on-chain writes. NOTE: "0"/
# blank means anchor NOTHING (a safe stop), it is NOT unlimited -- only the explicit "unlimited" word is.
OBSERVE_ANCHOR = "live"
OBSERVE_ANCHOR_DAILY_CAP = "unlimited"

# Secrets (set with `wrangler secret put <NAME>`, never committed here):
#   SOLANA_RPC                       private first-choice RPC URL (Alchemy key);
#                                    falls back to SOLANA_RPC_FALLBACKS above
#   OPENAI_API_KEY / DEEPSEEK_API_KEY  (optional primary live-model discussion)
#   GROK_API_KEY / XAI_API_KEY         (optional 2nd model, xAI Grok; runs alongside the
#                                    primary so the discussion shows a caveat per model.
#                                    base/model come from GROK_BASE_URL / GROK_MODEL vars)
#   SOLANA_KEYPAIR                   mainnet fee-payer secret key JSON array (funded)
